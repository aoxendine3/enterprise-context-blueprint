[package]
name = "mtpo_deeplock_core"
version = "1.0.0"
edition = "2021"
authors = ["XORAS Lead 9 Council <admin@xoras.os>"]
description = "Zero-Abort Concurrency Middleware for Multi-Agent Swarms"

[lib]
name = "mtpo_deeplock_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module"] }
tokio = { version = "1.35", features = ["full"] }
hexcell-memory = { path = "../../core/ops/src/hexcell-memory", optional = true }

[features]
default = []
enterprise_swarm = ["hexcell-memory"]
