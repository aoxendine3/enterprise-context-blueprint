[package]
name = "mtpo_deeplock_core"
version = "1.0.0"
edition = "2021"
authors = ["XORAS Lead 9 Council <admin@xoras.os>"]
description = "Zero-Abort Concurrency Middleware for Multi-Agent Swarms"

[lib]
name = "mtpo_deeplock_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.20.0", features = ["extension-module"] }
tokio = { version = "1.35", features = ["full"] }
sha2 = "0.10"
[features]
default = []

