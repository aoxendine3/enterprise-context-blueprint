# Wake Manifest – Xoras Sovereign Citadel
# This file defines the exact ordered steps an agent must follow on first breath.
# It is a DAG (directed‑acyclic graph) expressed in a simple YAML list where each
# entry points to the next via the `next` key. The engine that reads this file
# will enforce the order – no step is skipped.

steps:
  - id: identity_load
    description: Load immutable identity card (identity/charter.yaml) and agent card.
    action: load_identity
    next: hydrate_state

  - id: hydrate_state
    description: Restore short‑term session memory (memory/agent_logs/agent_inbox.jsonl).
    action: hydrate_state
    next: load_long_term

  - id: load_long_term
    description: Load persistent context (memory/tri_brain/, memory/catch_log/).
    action: load_long_term
    next: security_checks

  - id: security_checks
    description: Verify permissions, Merkle gate, and 7‑layer funnel invariants.
    action: security_checks
    next: activate_role

  - id: activate_role
    description: Enable task‑scoped capabilities and start the agent loop.
    action: activate_role
    next: null

# The manifest is deliberately small (≈50 lines) and lives at the root of the SSOT.
# The boot loader (`ops/scripts/boot_wake.sh`) reads this YAML, executes the actions
# in order, and writes a receipt to `memory/catch_log/wake_manifest.log`.
