<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XORAS Sovereign Stage</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html {
            width: 100vw; height: 100vh;
            overflow: hidden;
            background: #020408;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
        }

        /* 3D Background Canvas: Sits BEHIND everything (Zero visual obstruction) */
        #webglCanvas {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        /* Top Sovereign Header */
        .top-bar {
            position: absolute; top: 22px; left: 32px;
            z-index: 20;
            font-size: 13px; font-weight: 800; letter-spacing: 3px; color: #94A3B8;
            display: flex; align-items: center;
        }
        .live-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            background: #00F2FE; margin-right: 12px;
            box-shadow: 0 0 14px #00F2FE;
            animation: pulse 1.8s infinite ease-in-out;
        }
        @keyframes pulse { 0% { opacity:0.3; transform:scale(0.85); } 50% { opacity:1; transform:scale(1.15); } 100% { opacity:0.3; transform:scale(0.85); } }

        /* Main Stage Frame: Centered cleanly in front of the 3D diagram */
        #stageContainer {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            z-index: 10;
            pointer-events: none;
        }

        /* Agent Portrait Container (Max Headroom Digital Avatar Aesthetic) */
        #portraitWrap {
            position: absolute;
            top: 42%; left: 50%;
            transform: translate(-50%, -50%);
            width: 78vw; height: 70vh;
            max-width: 1000px; max-height: 640px;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.98), 0 0 50px rgba(0, 242, 254, 0.25);
            border: 1px solid rgba(0, 242, 254, 0.4);
            background: #000;
        }

        /* Digital CRT Scanlines Overlay */
        #portraitWrap::after {
            content: "";
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 2;
            opacity: 0.75;
        }

        #agentPortrait {
            width: 100%; height: 100%;
            object-fit: cover; object-position: center 20%;
            transition: opacity 0.3s ease, transform 0.5s ease, filter 0.3s ease;
            opacity: 1;
            display: block;
            filter: contrast(1.08) brightness(1.02);
        }

        /* Condensed, Refined Caption Bar: Generous clearance, zero text overlap */
        .caption-card {
            position: absolute; bottom: 22px; left: 50%;
            transform: translateX(-50%);
            width: 86%; max-width: 780px;
            z-index: 30;
            background: rgba(3, 7, 14, 0.94);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 14px;
            padding: 12px 24px 18px 24px;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            pointer-events: auto;
            box-sizing: border-box;
        }

        .caption-header {
            display: flex; align-items: center; justify-content: space-between; width: 100%;
            margin-bottom: 6px; padding-bottom: 5px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .agent-badge {
            font-size: 10px; font-weight: 800; letter-spacing: 2px;
            color: #00F2FE; text-transform: uppercase;
        }
        .stream-status {
            font-size: 9px; font-weight: 700; letter-spacing: 1.2px;
            color: #64748B;
        }
        .stream-status.speaking {
            color: #38BDF8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.8);
        }

        /* Spoken Words Stream: Generous line height and bottom clearance to prevent ANY overlap */
        .words-box {
            width: 100%; min-height: 52px; max-height: 108px;
            overflow-y: hidden;
            display: block; text-align: center;
            padding: 4px 8px 14px 8px;
            box-sizing: border-box;
            line-height: 1.8;
        }

        .speech-word {
            font-size: 15px; font-weight: 600; color: #64748B;
            transition: color 0.08s ease, transform 0.1s ease, text-shadow 0.1s ease;
            display: inline-block; margin: 3px 5px;
            line-height: 1.6; vertical-align: baseline;
        }
        .speech-word.active {
            color: #00F2FE !important;
            font-weight: 800 !important;
            transform: scale(1.12);
            text-shadow: 0 0 12px rgba(0, 242, 254, 1), 0 0 20px rgba(0, 242, 254, 0.7);
        }
        .speech-word.spoken {
            color: #E2E8F0 !important;
            font-weight: 600;
        }

        /* Top Bar Container with IP Shield Protection Indicator */
        .top-bar-wrap {
            position: absolute; top: 22px; left: 32px; right: 32px;
            display: flex; align-items: center; justify-content: space-between;
            z-index: 20;
        }
        .ip-shield-badge {
            font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
            color: #10B981; background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            padding: 4px 10px; border-radius: 6px;
            text-transform: uppercase;
        }

        /* Diagram Legend Label */
        .diagram-legend {
            position: absolute; bottom: 22px; right: 32px;
            z-index: 20;
            font-size: 10px; font-weight: 700; letter-spacing: 2px;
            color: rgba(0, 242, 254, 0.5);
            text-transform: uppercase;
        }

        /* Real-Time Interactive Agent Control Toolbar */
        .agent-control-bar {
            position: absolute; top: 22px; right: 32px;
            z-index: 30;
            display: flex; gap: 8px; align-items: center;
            background: rgba(3, 7, 14, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 20px; padding: 4px 10px;
        }
        .agent-btn {
            background: transparent; border: 1px solid rgba(255,255,255,0.15);
            color: #94A3B8; font-size: 10px; font-weight: 700; letter-spacing: 1px;
            padding: 4px 10px; border-radius: 14px; cursor: pointer;
            transition: all 0.15s ease;
        }
        .agent-btn:hover, .agent-btn.active {
            background: rgba(0, 242, 254, 0.2);
            border-color: #00F2FE; color: #00F2FE;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
        }
    </style>
    <!-- Local Offline 3D Engines -->
    <script src="/three.min.js"></script>
    <script src="/orbit_controls.js"></script>
</head>
<body>
    <!-- Real-Time Interactive Agent Control Toolbar -->
    <div class="agent-control-bar">
        <span style="font-size:9px; font-weight:800; letter-spacing:1px; color:#00F2FE; margin-right:4px;">AGENTS:</span>
        <button class="agent-btn active" onclick="switchAgentInteractive('maxx')">MAXX</button>
        <button class="agent-btn" onclick="switchAgentInteractive('vance')">VANCE</button>
        <button class="agent-btn" onclick="switchAgentInteractive('clara')">CLARA</button>
        <button class="agent-btn" onclick="switchAgentInteractive('john')">JOHN</button>
        <button class="agent-btn" onclick="switchAgentInteractive('selene')">SELENE</button>
        <button class="agent-btn" onclick="switchAgentInteractive('jarvis')">JARVIS</button>
    </div>
    <!-- 1. Background 3D Architectural Diagram Canvas -->
    <canvas id="webglCanvas"></canvas>

    <div class="top-bar-wrap">
        <div class="top-bar">
            <span class="live-dot"></span>XORAS SOVEREIGN STAGE
        </div>
        <div class="ip-shield-badge">
            🛡️ CC0 1.0 OPEN-SOURCE · IP SHIELD PROTECTED
        </div>
    </div>

    <div class="diagram-legend" id="diagramLabel">TRIPLE 3D TRI-BRAIN ARCHITECTURE · 3072-DIMENSIONAL SPATIAL MESH</div>

    <!-- 2. Main Visual Portrait Frame -->
    <div id="stageContainer">
        <div id="portraitWrap">
            <img id="agentPortrait" src="/images/maxx.jpg" alt="Sovereign Agent" />
        </div>
    </div>

    <!-- 3. Accessible Captions: ONLY Displays What Is Being Spoken -->
    <div class="caption-card">
        <div class="caption-header">
            <span class="agent-badge" id="activeAgentRole">MAXX · OPS LEAD & LOCAL SSOT</span>
            <span class="stream-status" id="streamStatus">LIVE</span>
        </div>
        <div class="words-box" id="tickerContent">
            <!-- Dynamically populated with actual speech words. Zero boilerplate. -->
        </div>
    </div>

    <!-- Script 1: Real-Time Subtitle & Image Switching Engine -->
    <script>
        const AGENT_ROSTER = {
            'maxx': { role: 'MAXX · OPS LEAD & LOCAL SSOT', img: '/images/maxx.jpg', color: 0x00F2FE },
            'daxx': { role: 'DAXX · ORCHESTRATED MENTOR & ELITE ARCHITECT', img: '/images/daxx.jpg', color: 0x38BDF8 },
            'vance': { role: 'WILLIAM VANCE · DISCERNMENT & BLACKBOX LEAD', img: '/images/vance.jpg', color: 0xF59E0B },
            'clara': { role: 'CLARA · DEEP RESEARCH & REASONING', img: '/images/clara.jpg', color: 0x10B981 },
            'john': { role: 'JOHN · SILICON SYSTEMS ARCHITECT', img: '/images/john.jpg', color: 0x3B82F6 },
            'selene': { role: 'SELENE · ACOUSTICS & CINEMATICS', img: '/images/selene.jpg', color: 0xEC4899 },
            'jarvis': { role: 'JARVIS · TASK & LOCAL MODEL ORCHESTRATOR', img: '/images/jarvis.jpg', color: 0x8B5CF6 },
            'dr_jeremy': { role: 'DR. JEREMY BROWN · COGNITIVE HEALTH & LOGIC', img: '/images/dr_jeremy.jpg', color: 0x06B6D4 },
            'jeremy': { role: 'DR. JEREMY BROWN · COGNITIVE HEALTH & LOGIC', img: '/images/dr_jeremy.jpg', color: 0x06B6D4 },
            'dr_eden': { role: 'DR. EDEN · COGNITIVE DYNAMICS & HUMAN ALIGNMENT', img: '/images/eden.jpg', color: 0x14B8A6 },
            'eden': { role: 'DR. EDEN · COGNITIVE DYNAMICS & HUMAN ALIGNMENT', img: '/images/eden.jpg', color: 0x14B8A6 },
            'orion': { role: 'ORION · HORIZONTAL SCALING & MEDIA DIRECTOR', img: '/images/orion.jpg', color: 0x6366F1 },
            'aurelius': { role: 'AURELIUS · STRATEGIC FORESIGHT', img: '/images/arelius.jpg', color: 0xD97706 },
            'evan': { role: 'EVAN · DISPATCH & TELEMETRY', img: '/images/atlas.jpg', color: 0x0284C7 },
            'zorex': { role: 'ZOREX · INFRASTRUCTURE CORE', img: '/images/xoras.jpg', color: 0x475569 },
            'apex': { role: 'APEX · SILICON & HARDWARE ARCHITECT', img: '/images/atlas.jpg', color: 0xF43F5E },
            'sentinel': { role: 'SENTINEL · DEEP SECURITY & ENCLAVE', img: '/images/nova.jpg', color: 0x10B981 }
        };

        // Instant Preloading in Memory (Guarantees zero network lag or missing onload)
        const imagePreloadStore = {};
        Object.keys(AGENT_ROSTER).forEach(k => {
            const pre = new Image();
            pre.src = AGENT_ROSTER[k].img;
            imagePreloadStore[k] = pre;
        });

        let currentAgentKey = 'maxx';
        let userSelectedAgent = null;
        let lastTimingText = '';
        let activeTiming = null;

        function switchAgentInteractive(agentKey) {
            const cleanKey = (agentKey || 'maxx').toLowerCase().trim();
            userSelectedAgent = cleanKey;
            updateAgentVisual(cleanKey);

            // Update UI Button highlights
            document.querySelectorAll('.agent-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.innerText.toLowerCase() === cleanKey) {
                    btn.classList.add('active');
                }
            });

            // Update 3D Diagram theme dynamically
            const info = AGENT_ROSTER[cleanKey] || AGENT_ROSTER['maxx'];
            if (window.updateDiagramTheme) {
                window.updateDiagramTheme(info.color, info.role);
            }
        }

        function updateAgentVisual(agentKey) {
            const cleanKey = (agentKey || 'maxx').toLowerCase().trim();
            if (cleanKey === currentAgentKey) return;
            currentAgentKey = cleanKey;

            const info = AGENT_ROSTER[cleanKey] || AGENT_ROSTER['maxx'];
            const portraitEl = document.getElementById('agentPortrait');
            const roleEl = document.getElementById('activeAgentRole');

            if (roleEl) roleEl.innerText = info.role;

            if (portraitEl) {
                portraitEl.style.opacity = '0.2';
                setTimeout(() => {
                    portraitEl.src = info.img;
                    portraitEl.style.opacity = '1';
                }, 60);
            }

            // Reconfigure 3D Architectural Diagram color for this agent
            if (window.updateDiagramTheme) {
                window.updateDiagramTheme(info.color, cleanKey.toUpperCase());
            }
        }

        function renderWords(words) {
            const container = document.getElementById('tickerContent');
            container.innerHTML = '';
            container.scrollTop = 0;
            words.forEach((item, idx) => {
                const span = document.createElement('span');
                span.className = 'speech-word';
                span.id = 'word-' + idx;
                span.innerText = item.word;
                container.appendChild(span);
            });
        }

        // 35ms Polling Loop for Synchronous Caption Highlighting
        setInterval(() => {
            fetch('/current_timing.json', { cache: 'no-store' })
                .then(r => {
                    if (!r.ok) throw new Error('Status ' + r.status);
                    return r.json();
                })
                .then(data => {
                    if (!data) return;

                    // Render actual speech text ONLY. Zero boilerplate.
                    if (data.text) {
                        const isNewText = (data.text !== lastTimingText);
                        const justFinishedSynth = (!data.synthesizing && activeTiming && activeTiming.synthesizing);

                        if (isNewText) {
                            userSelectedAgent = null; // Reset override on new speech turn
                        }

                        const targetAgent = userSelectedAgent || data.agent || 'maxx';
                        updateAgentVisual(targetAgent);

                        if (isNewText || justFinishedSynth) {
                            lastTimingText = data.text;
                            activeTiming = data;
                            if (data.words && data.words.length > 0) {
                                renderWords(data.words);
                            } else {
                                const container = document.getElementById('tickerContent');
                                container.innerHTML = '<span class="speech-word spoken">' + data.text + '</span>';
                            }
                        } else if (activeTiming && !data.synthesizing) {
                            // Update playback timestamp and timings calibrated to actual generated audio
                            activeTiming.start_time = data.start_time;
                            activeTiming.total_duration = data.total_duration;
                            activeTiming.synthesizing = false;
                            activeTiming.complete = data.complete;
                            if (data.words && data.words.length > 0) {
                                activeTiming.words = data.words;
                            }
                        }
                    }

                    // Active word glowing calculation in strict lockstep with audio DAC
                    if (activeTiming && activeTiming.words && activeTiming.words.length > 0) {
                        const statusEl = document.getElementById('streamStatus');

                        if (data.synthesizing) {
                            statusEl.innerText = 'PREPARING SPEECH STREAM';
                            statusEl.className = 'stream-status';
                            activeTiming.words.forEach((w, idx) => {
                                const el = document.getElementById('word-' + idx);
                                if (el) el.className = 'speech-word';
                            });
                        } else {
                            const elapsed = (Date.now() / 1000) - activeTiming.start_time;

                            if (data.complete || elapsed > (activeTiming.total_duration + 0.3)) {
                                activeTiming.words.forEach((w, idx) => {
                                    const el = document.getElementById('word-' + idx);
                                    if (el) el.className = 'speech-word spoken';
                                });
                                statusEl.innerText = 'ROUNDTABLE DELIBERATING';
                                statusEl.className = 'stream-status';
                            } else if (elapsed < 0) {
                                // Buffer lag: audio launching in < 70ms
                                activeTiming.words.forEach((w, idx) => {
                                    const el = document.getElementById('word-' + idx);
                                    if (el) el.className = 'speech-word';
                                });
                                statusEl.innerText = 'AUDIO BUFFER SYNCHRONIZING';
                                statusEl.className = 'stream-status speaking';
                            } else {
                                activeTiming.words.forEach((w, idx) => {
                                    const el = document.getElementById('word-' + idx);
                                    if (el) {
                                        if (elapsed >= w.start && elapsed <= w.end) {
                                            el.className = 'speech-word active';
                                            const box = document.getElementById('tickerContent');
                                            if (box) {
                                                const elTop = el.offsetTop - box.offsetTop;
                                                if (elTop > box.scrollTop + box.clientHeight - 38) {
                                                    box.scrollTo({ top: elTop - 18, behavior: 'smooth' });
                                                } else if (elTop < box.scrollTop) {
                                                    box.scrollTo({ top: Math.max(0, elTop - 8), behavior: 'smooth' });
                                                }
                                            }
                                        } else if (elapsed > w.end) {
                                            el.className = 'speech-word spoken';
                                        } else {
                                            el.className = 'speech-word';
                                        }
                                    }
                                });
                                statusEl.innerText = 'LIVE SPEECH STREAM';
                                statusEl.className = 'stream-status speaking';
                            }
                        }
                    }
                })
                .catch(() => {
                    fetch('/current_image.txt', { cache: 'no-store' })
                        .then(r => r.text())
                        .then(txt => { if (txt) updateAgentVisual(txt); })
                        .catch(()=>{});
                });
        }, 35);
    </script>

    <!-- Script 2: True 3D Architectural Diagram of Each Agent (Rendered in Background) -->
    <script>
        if (typeof THREE !== 'undefined') {
            const canvas = document.getElementById('webglCanvas');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 12;

            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            
            // =========================================================================
            // XORAS: 18,432D HEXGRAPH NAVIER-STOKES SWARM (24-HEAD TOPOLOGY)
            // =========================================================================
            const diagramGroup = new THREE.Group();
            scene.add(diagramGroup);

            const particleCount = 10000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const initialPositions = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                let x = (Math.random() - 0.5) * 30;
                let y = (Math.random() - 0.5) * 30;
                let z = (Math.random() - 0.5) * 30;
                positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z;
                initialPositions[i*3] = x; initialPositions[i*3+1] = y; initialPositions[i*3+2] = z;
            }
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({ 
                color: 0x00F2FE, 
                size: 0.08, 
                transparent: true, 
                opacity: 0.9,
                blending: THREE.AdditiveBlending 
            });
            const swarm = new THREE.Points(geometry, material);
            diagramGroup.add(swarm);

            let clock = new THREE.Clock();

            window.updateDiagramTheme = function(colorHex, agentName) {
                material.color.setHex(colorHex);
                const label = document.getElementById('diagramLabel');
                if (label) {
                    label.style.color = '#' + colorHex.toString(16).padStart(6, '0');
                }
            };

            function animateDiagram() {
                requestAnimationFrame(animateDiagram);
                const elapsed = clock.getElapsedTime();
                const pos = geometry.attributes.position.array;
                
                let maxVorticity = 0;
                let hexGraphEngaged = false;
                
                // Induce the singularity over time (Chaos multiplies every second)
                let chaosMultiplier = 1.0 + (elapsed * 0.6); 
                
                // Once chaos crosses the blow-up threshold, the 18432D HexGraph snaps it into place
                if (chaosMultiplier > 5.0) {
                    hexGraphEngaged = true;
                }
                
                for (let i = 0; i < particleCount; i++) {
                    let x = pos[i*3];
                    let y = pos[i*3+1];
                    let z = pos[i*3+2];
                    
                    // 3D Incompressible Flow (Approaching Singularity)
                    let vx = Math.sin(y * 0.8 + elapsed) * chaosMultiplier - x * 0.05;
                    let vy = Math.cos(z * 0.8 + elapsed) * chaosMultiplier - y * 0.05;
                    let vz = Math.sin(x * 0.8 + elapsed) * chaosMultiplier - z * 0.05;

                    if (hexGraphEngaged) {
                        // HEXGRAPH 18,432D PROJECTION & 24-HEAD STABILIZATION
                        // The metric warp W=0.0229 forces the chaotic flow into a stable hexagonal resonance
                        const W = 0.0229;
                        const hexScale = 1.8;
                        
                        let hx = Math.round(x / hexScale) * hexScale;
                        let hy = Math.round(y / hexScale) * hexScale;
                        let hz = Math.round(z / hexScale) * hexScale;
                        
                        // 24 Heads apply topological containment forces
                        vx += (hx - x) * 24.0 * W * (chaosMultiplier * 0.5);
                        vy += (hy - y) * 24.0 * W * (chaosMultiplier * 0.5);
                        vz += (hz - z) * 24.0 * W * (chaosMultiplier * 0.5);
                    }

                    pos[i*3] += vx * 0.015;
                    pos[i*3+1] += vy * 0.015;
                    pos[i*3+2] += vz * 0.015;

                    let vorticity = Math.sqrt(vx*vx + vy*vy + vz*vz);
                    if (vorticity > maxVorticity) maxVorticity = vorticity;

                    if (Math.abs(x) > 15 || Math.abs(y) > 15 || Math.abs(z) > 15) {
                        pos[i*3] = initialPositions[i*3];
                        pos[i*3+1] = initialPositions[i*3+1];
                        pos[i*3+2] = initialPositions[i*3+2];
                    }
                }
                
                geometry.attributes.position.needsUpdate = true;
                
                diagramGroup.rotation.y = elapsed * 0.08;
                diagramGroup.rotation.x = Math.sin(elapsed * 0.02) * 0.15;

                renderer.render(scene, camera);
                
                // Live Swarm HUD Updates
                const label = document.getElementById('diagramLabel');
                if (label) {
                    if (hexGraphEngaged) { 
                        label.innerHTML = `⚛️ HEXGRAPH 18,432D ENGAGED (24-HEAD) ⚛️<br>SINGULARITY CONTAINED | METRIC WARP: W=0.0229 | VORTICITY: BOUNDED`;
                        label.style.color = '#00FF99';
                        material.color.setHex(0x00FF99);
                        material.size = 0.06;
                    } else if (maxVorticity > 3.9) { 
                        label.innerHTML = `⚠️ CRITICAL: INDUCING NAVIER-STOKES BLOW-UP ⚠️<br>VORTICITY SPIKE: ${maxVorticity.toFixed(2)} | PREPARING HEXGRAPH...`;
                        label.style.color = '#FF0033';
                        material.color.setHex(0xFF0033);
                        material.size = 0.12;
                    } else {
                        label.innerHTML = `3D NAVIER-STOKES SWARM<br>NODES: 10,000 | VORTICITY MAX: ${maxVorticity.toFixed(4)}`;
                        material.color.setHex(0x00F2FE);
                        label.style.color = '#00F2FE';
                        material.size = 0.08;
                    }
                }
            }
            animateDiagram();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
