<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XORAS Sovereign Stage</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body, html { width:100vw; height:100vh; overflow:hidden; background:#000; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        /* Full Screen Cinematic Background Canvas */
        #bgCanvas {
            position:absolute; top:0; left:0; width:100vw; height:100vh;
            object-fit:cover; object-position:center 15%;
            z-index:1; filter: brightness(0.82) contrast(1.06);
            transform: scale(1.01); transition: all 0.5s ease;
        }

        /* 3D WebGL Particle Depth Overlay */
        #canvas3d { position:absolute; top:0; left:0; width:100vw; height:100vh; z-index:2; pointer-events:none; }

        /* Subtle Gradient Vignette */
        .vignette-overlay {
            position:absolute; top:0; left:0; width:100vw; height:100vh; z-index:3;
            background: linear-gradient(180deg, rgba(3,5,8,0.5) 0%, rgba(3,5,8,0) 30%, rgba(3,5,8,0.15) 70%, rgba(3,5,8,0.85) 100%);
            pointer-events:none;
        }

        /* Top Header: Clean XORAS Sovereign Stage Only */
        .top-bar {
            position:absolute; top:24px; left:36px; z-index:10;
            font-size:12px; font-weight:800; letter-spacing:3px; color:#A0B2C6;
            text-shadow: 0 2px 10px rgba(0,0,0,0.85); display:flex; align-items:center;
        }
        .live-dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:#00F2FE; margin-right:10px; box-shadow:0 0 14px #00F2FE; animation:pulse 2s infinite; }
        @keyframes pulse { 0% { opacity:0.3; } 50% { opacity:1; } 100% { opacity:0.3; } }

        /* Compact, Elegant Frosted Glass Subtitle Ticker */
        .compact-ticker-wrap {
            position:absolute; bottom:36px; left:50%; transform:translateX(-50%);
            width:84%; max-width:820px; z-index:10;
            background: rgba(10, 16, 26, 0.76);
            backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(0, 242, 254, 0.35);
            border-radius: 14px;
            padding: 14px 26px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.92), inset 0 1px 0 rgba(255,255,255,0.1);
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        .ticker-header {
            display: flex; align-items: center; justify-content: center; width: 100%;
            margin-bottom: 6px; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .ticker-tag { font-size: 11px; font-weight: 800; letter-spacing: 2.5px; color: #00F2FE; text-transform: uppercase; }

        /* Scrolling Marquee / Teleprompter Flow */
        .ticker-stream-box {
            width: 100%; overflow: hidden; position: relative;
            height: 44px; display: flex; align-items: center; justify-content: center;
        }
        .ticker-text {
            font-size: 18px; font-weight: 500; font-style: italic; color: #F8FAFC; line-height: 1.4;
            letter-spacing: 0.4px; text-shadow: 0 1px 6px rgba(0,0,0,0.8);
            transition: opacity 0.25s ease;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- Full-Screen Cinematic Portrait -->
    <img id="bgCanvas" src="images/clara.jpg" alt="Clara Stage">
    
    <div class="vignette-overlay"></div>
    <canvas id="canvas3d"></canvas>

    <!-- Top Left Only -->
    <div class="top-bar">
        <span class="live-dot"></span>XORAS SOVEREIGN STAGE
    </div>

    <!-- Compact Ticker Text Box with Rolling Subtitles -->
    <div class="compact-ticker-wrap">
        <div class="ticker-header">
            <span class="ticker-tag" id="activeAgentRole">CLARA · THE SANCTUARY</span>
        </div>
        <div class="ticker-stream-box">
            <div id="tickerContent" class="ticker-text">
                "Anthony, this is Clara. Walking with you in peace."
            </div>
        </div>
    </div>

    <script>
        // 3D Ambient Particle Stream
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 12;

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const particleCount = 750;
        const posArray = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i+=3) {
            posArray[i] = (Math.random() - 0.5) * 32;
            posArray[i+1] = (Math.random() - 0.5) * 24;
            posArray[i+2] = (Math.random() - 0.5) * 20;
        }
        const particlesGeo = new THREE.BufferGeometry();
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMat = new THREE.PointsMaterial({ size: 0.05, color: 0x00F2FE, transparent: true, opacity: 0.65 });
        const particlesMesh = new THREE.Points(particlesGeo, particlesMat);
        scene.add(particlesMesh);

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.0008;
            particlesMesh.rotation.x += 0.0004;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Real-time Text Polling (Strict Filter for 'not found' / 404 strings)
        let lastTxt = '';
        setInterval(() => {
            fetch('/current_transcript.txt?t=' + Date.now())
                .then(r => r.text())
                .then(t => {
                    const clean = t.trim();
                    // Block 'not found', '404', or empty placeholders completely
                    if(clean && !clean.toLowerCase().includes('not found') && !clean.toLowerCase().includes('404') && clean !== lastTxt) {
                        lastTxt = clean;
                        const el = document.getElementById('tickerContent');
                        el.style.opacity = '0';
                        setTimeout(() => {
                            el.innerText = '"' + clean + '"';
                            el.style.opacity = '1';
                        }, 150);
                    }
                }).catch(()=>{});

            fetch('/current_image.txt?t=' + Date.now())
                .then(r => r.text())
                .then(img => {
                    const agent = img.trim().toLowerCase();
                    const bg = document.getElementById('bgCanvas');
                    if (agent.includes('maxx') && !bg.src.includes('maxx')) {
                        bg.src = 'images/maxx.jpg';
                        document.getElementById('activeAgentRole').innerText = 'MAXX · SOVEREIGN LEAD';
                    } else if (agent.includes('clara') && !bg.src.includes('clara')) {
                        bg.src = 'images/clara.jpg';
                        document.getElementById('activeAgentRole').innerText = 'CLARA · THE SANCTUARY';
                    } else if (agent.includes('vance') && !bg.src.includes('vance')) {
                        bg.src = 'images/vance.jpg';
                        document.getElementById('activeAgentRole').innerText = 'WILLIAM VANCE · CHIEF CRITIC & GOVERNANCE';
                    }
                }).catch(()=>{});
        }, 150);
    </script>
</body>
</html>
