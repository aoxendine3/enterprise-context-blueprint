version: '3.8'
services:
  xmars_forge_daemon:
    build: .
    container_name: xoras_autonomous_forge
    restart: always
    volumes:
      - ../../../memory:/app/SSOT_Agentic_Brain/memory
      - ../../../identity:/app/SSOT_Agentic_Brain/identity
    environment:
      - OFFGRID_MODE=true
    ports:
      - "8085:8085"
