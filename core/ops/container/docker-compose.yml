version: '3.8'

services:
  xoras-sovereign-stage:
    build:
      context: ../..
      dockerfile: ops/container/Dockerfile
    container_name: xoras_systems_linux_core
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - XORAS_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ../..:/opt/xoras/SSOT_Agentic_Brain
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/customer_app.html"]
      interval: 10s
      timeout: 5s
      retries: 3
