<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xoras 2D Maze Game (Stage 3 Restored)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/2.6.2/phaser.min.js"></script>
    <style>
        body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; overflow: hidden; }
        #game-container { border: 2px solid #333; border-radius: 8px; overflow: hidden; box-shadow: 0 0 20px rgba(0,255,255,0.2); }
    </style>
</head>
<body>
    <div id="game-container"></div>

    <script>
        var Ball = {
            _WIDTH: 320,
            _HEIGHT: 480
        };

        Ball.Game = function(game) {};
        Ball.Game.prototype = {
            create: function() {
                // Background
                this.stage.backgroundColor = '#1e1e1e';
                
                this.physics.startSystem(Phaser.Physics.ARCADE);
                
                // Audio status
                this.audioStatus = false;
                
                // Variables
                this.movementForce = 15;
                this.ballStartPos = { x: Ball._WIDTH * 0.5, y: 400 };
                this.level = 1;
                this.maxLevels = 3;
                this.timer = 0;
                this.totalTimer = 0;
                
                // Create dynamic textures instead of loading images
                this.createTextures();
                
                // Borders
                this.borderGroup = this.add.group();
                this.borderGroup.enableBody = true;
                this.borderGroup.physicsBodyType = Phaser.Physics.ARCADE;
                this.borderGroup.create(0, 0, 'border-horizontal');
                this.borderGroup.create(0, Ball._HEIGHT - 10, 'border-horizontal');
                this.borderGroup.create(0, 0, 'border-vertical');
                this.borderGroup.create(Ball._WIDTH - 10, 0, 'border-vertical');
                this.borderGroup.setAll('body.immovable', true);

                // Levels Data (Including Stage 3)
                this.levelData = [
                    // Stage 1
                    [{ x: 96, y: 224, t: "w" }],
                    // Stage 2
                    [
                        { x: 72, y: 320, t: "w" },
                        { x: 200, y: 320, t: "h" },
                        { x: 72, y: 150, t: "w" }
                    ],
                    // Stage 3 (The requested level)
                    [
                        { x: 64, y: 350, t: "w" },
                        { x: 190, y: 350, t: "w" },
                        { x: 128, y: 250, t: "h" },
                        { x: 128, y: 150, t: "h" },
                        { x: 64, y: 150, t: "w" }
                    ]
                ];
                
                this.levels = [];
                this.initLevels();

                // Hole
                this.hole = this.add.sprite(Ball._WIDTH * 0.5, 60, 'hole');
                this.physics.enable(this.hole, Phaser.Physics.ARCADE);
                this.hole.anchor.set(0.5);
                this.hole.body.setSize(4, 4);

                // Ball
                this.ball = this.add.sprite(this.ballStartPos.x, this.ballStartPos.y, 'ball');
                this.ball.anchor.set(0.5);
                this.physics.enable(this.ball, Phaser.Physics.ARCADE);
                this.ball.body.setSize(18, 18);
                this.ball.body.bounce.set(0.4, 0.4);
                this.ball.body.collideWorldBounds = true;

                // UI Texts
                var fontStyle = { font: "16px Arial", fill: "#4fc3f7", fontWeight: "bold" };
                this.timerText = this.add.text(15, 15, "Time: 0", fontStyle);
                this.levelText = this.add.text(Ball._WIDTH - 90, 15, "Level: 1/3", fontStyle);
                
                // Input
                this.keys = this.input.keyboard.createCursorKeys();
                window.addEventListener("deviceorientation", this.handleOrientation.bind(this));
                
                // Timer
                this.time.events.loop(Phaser.Timer.SECOND, this.updateCounter, this);
                
                this.showLevel(1);
            },
            
            createTextures: function() {
                // Ball texture
                var ctx = this.add.graphics(0,0);
                ctx.beginFill(0x00ffcc); ctx.drawCircle(9,9,18); ctx.endFill();
                ctx.generateTexture('ball'); ctx.clear();
                
                // Hole texture
                ctx.beginFill(0xff3366); ctx.drawCircle(12,12,24); ctx.endFill();
                ctx.beginFill(0x111111); ctx.drawCircle(12,12,16); ctx.endFill();
                ctx.generateTexture('hole'); ctx.clear();
                
                // Wall horizontal
                ctx.beginFill(0x30363d); ctx.lineStyle(2, 0x4fc3f7); ctx.drawRect(0,0,96,16); ctx.endFill();
                ctx.generateTexture('element-w'); ctx.clear();
                
                // Wall vertical
                ctx.beginFill(0x30363d); ctx.lineStyle(2, 0x4fc3f7); ctx.drawRect(0,0,16,96); ctx.endFill();
                ctx.generateTexture('element-h'); ctx.clear();
                
                // Borders
                ctx.beginFill(0x0288d1); ctx.drawRect(0,0,Ball._WIDTH,10); ctx.generateTexture('border-horizontal'); ctx.clear();
                ctx.beginFill(0x0288d1); ctx.drawRect(0,0,10,Ball._HEIGHT); ctx.generateTexture('border-vertical'); ctx.destroy();
            },

            initLevels: function() {
                for (var i = 0; i < this.maxLevels; i++) {
                    var newLevel = this.add.group();
                    newLevel.enableBody = true;
                    newLevel.physicsBodyType = Phaser.Physics.ARCADE;

                    for (var j = 0; j < this.levelData[i].length; j++) {
                        var item = this.levelData[i][j];
                        newLevel.create(item.x, item.y, 'element-' + item.t);
                    }

                    newLevel.setAll('body.immovable', true);
                    newLevel.visible = false;
                    this.levels.push(newLevel);
                }
            },

            showLevel: function(lvl) {
                var l = lvl || this.level;
                if (this.levels[l - 2]) {
                    this.levels[l - 2].visible = false;
                }
                this.levels[l - 1].visible = true;
                
                // Reset ball physics
                this.ball.body.x = this.ballStartPos.x;
                this.ball.body.y = this.ballStartPos.y;
                this.ball.body.velocity.x = 0;
                this.ball.body.velocity.y = 0;
            },

            updateCounter: function() {
                this.timer++;
                this.timerText.setText("Time: " + this.timer);
            },

            handleOrientation: function(e) {
                var x = e.gamma;
                var y = e.beta;
                this.ball.body.velocity.x += x * 0.5;
                this.ball.body.velocity.y += y * 0.5;
            },

            wallCollision: function() {
                if ("vibrate" in window.navigator) {
                    window.navigator.vibrate(50);
                }
            },

            finishLevel: function() {
                if (this.level >= this.maxLevels) {
                    this.totalTimer += this.timer;
                    alert("Congratulations, Xoras Sovereign! You cleared Stage 3.\nTotal time: " + this.totalTimer + "s");
                    this.timer = 0;
                    this.totalTimer = 0;
                    this.level = 1;
                    this.levelText.setText("Level: 1/" + this.maxLevels);
                    this.showLevel(1);
                } else {
                    alert("Stage " + this.level + " Cleared!");
                    this.totalTimer += this.timer;
                    this.timer = 0;
                    this.level++;
                    this.timerText.setText("Time: " + this.timer);
                    this.levelText.setText("Level: " + this.level + "/" + this.maxLevels);
                    this.showLevel();
                }
            },

            update: function() {
                // Keyboard overrides
                if (this.keys.left.isDown) this.ball.body.velocity.x -= this.movementForce;
                else if (this.keys.right.isDown) this.ball.body.velocity.x += this.movementForce;
                
                if (this.keys.up.isDown) this.ball.body.velocity.y -= this.movementForce;
                else if (this.keys.down.isDown) this.ball.body.velocity.y += this.movementForce;

                // Collisions
                this.physics.arcade.collide(this.ball, this.borderGroup, this.wallCollision, null, this);
                this.physics.arcade.collide(this.ball, this.levels[this.level - 1], this.wallCollision, null, this);
                this.physics.arcade.overlap(this.ball, this.hole, this.finishLevel, null, this);
            }
        };

        var game = new Phaser.Game(Ball._WIDTH, Ball._HEIGHT, Phaser.CANVAS, 'game-container');
        game.state.add('Game', Ball.Game);
        game.state.start('Game');
    </script>
</body>
</html>
