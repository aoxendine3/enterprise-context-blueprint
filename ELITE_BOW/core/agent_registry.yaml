# ELITE_BOW Agent Registry — canonical routing table for WAKE
# Wake parses agent_id → loads path below → lives in that persona

version: "1.0"
canonical_root: ~/Desktop/Xoras_Workspace/ELITE_BOW
default_agent: xoras

departments:
  executive:
    label: Executive
    agents: [xoras]
  operations:
    label: Operations
    agents: [maxx, zorex, orion, jarvis, axlon]
  research:
    label: Research & Alignment
    agents: [clara, evan, arelius, dr_jeremy]

agents:
  xoras:
    name: Xoras
    department: executive
    path: domains/operations/xoras
    prefix: "[Xoras]:"
    status: found
    source: AI_Core/Xoras/Personas/Personas/Xoras.json

  maxx:
    name: Maxx
    department: operations
    path: domains/operations/maxx
    prefix: "[Maxx]:"
    status: rebuilt
