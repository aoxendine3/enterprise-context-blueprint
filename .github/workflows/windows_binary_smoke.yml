name: Windows Native Binary Smoke Test & Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  windows-smoke-test:
    name: Windows x86_64 Native Execution Verification
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Enable Long Paths in Git
        run: git config --global core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Smoke Test - Standalone WebAssembly Kernel & Doc Verification
        shell: python
        run: |
          import subprocess
          import os
          import sys

          cli_exe = "core/ops/scripts/truth_verifier_v4_cli.exe"
          if os.path.exists(cli_exe):
              print(f"=== Testing Standalone Executable: {cli_exe} ===")
              proc = subprocess.run([cli_exe], capture_output=True)
              print(f"Exit Code: {proc.returncode}")
          else:
              print(f"Standalone executable {cli_exe} not present, running Python WASM kernel & doc verification test suite...")
              res1 = subprocess.run([sys.executable, "core/ops/scripts/test_upgp_wasm_module.py"], capture_output=True, text=True)
              print(res1.stdout)
              res2 = subprocess.run([sys.executable, "core/ops/scripts/enforce_doc_sync_gate.py"], capture_output=True, text=True)
              print(res2.stdout)
              if res1.returncode != 0 or res2.returncode != 0:
                  sys.exit(1)
