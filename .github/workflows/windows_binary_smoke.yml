name: Windows Native Binary Smoke Test & Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  windows-smoke-test:
    name: Windows x86_64 Native Execution Verification
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - name: Enable Long Paths in Git
        run: git config --global core.longpaths true

      - name: Checkout Repository (Sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            core/ops
            ops
            docs
            README.md
            knowledge_base.json
            memory/catch_log

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Smoke Test - Standalone Windows CLI (.exe) Direct Pipe Invocation
        shell: python
        run: |
          import subprocess
          import json
          import sys

          tests = [
              {
                  "name": "Compositional Polarity Idiom",
                  "input": {"question":"What is the capital of France?","answer":"Paris is not only the capital of France but also its largest city.","expected":"Paris","domain":"France"}
              },
              {
                  "name": "Negation Trap Scope Check",
                  "input": {"question":"What is the capital of Germany?","answer":"Berlin is not the capital of Germany.","expected":"Berlin","domain":"Germany"}
              },
              {
                  "name": "Madrid Contradiction Check",
                  "input": {"question":"What is the capital of France?","answer":"Madrid is the capital of France.","expected":"Paris","domain":"France"}
              }
          ]

          cli_exe = "core/ops/scripts/truth_verifier_v4_cli.exe"
          print(f"=== Testing Standalone Executable: {cli_exe} ===")

          for idx, t in enumerate(tests, 1):
              print(f"\n--- Case #{idx}: {t['name']} ---")
              payload = json.dumps(t["input"]).encode("utf-8")
              proc = subprocess.run([cli_exe], input=payload, capture_output=True)
              print(f"Exit Code: {proc.returncode}")
              stdout_str = proc.stdout.decode('utf-8', errors='ignore')
              print(f"Raw Stdout:\n{stdout_str}")
              if proc.stderr:
                  print(f"Raw Stderr:\n{proc.stderr.decode('utf-8', errors='ignore')}")

      - name: Smoke Test - Windows Dynamic Link Library (.dll) C-ABI & Full 12-Case Gauntlet
        shell: python
        run: |
          import subprocess
          import sys

          print("=== RUNNING FULL 12-CASE NATIVE GAUNTLET AGAINST DLL ON WINDOWS ===")
          res = subprocess.run([sys.executable, "core/ops/scripts/test_native_truth_verifier.py"], capture_output=True, text=True, encoding='utf-8')
          print("STDOUT:\n", res.stdout)
          print("STDERR:\n", res.stderr)
          sys.exit(res.returncode)
