name: UPGP Proving Ground Verification Gate

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js & Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run WebAssembly & Document Sync Tests
        run: |
          python3 core/ops/scripts/test_upgp_wasm_module.py
          python3 core/ops/scripts/enforce_doc_sync_gate.py
