name: Reproducible Build & Bit-for-Bit Determinism Audit

on:
  push:
    branches: [ main, master ]
    paths:
      - 'ops/runtime/**'
      - 'ops/reproducibility/**'
      - 'core/ops/reproducibility/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'ops/runtime/**'
      - 'ops/reproducibility/**'
      - 'core/ops/reproducibility/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-build-audit:
    name: 5-Move Deterministic Reproducibility Audit
    runs-on: macos-14 # Apple Silicon M-series runner for bare metal parity
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Move 1: Zero-Trust Digest-Pinned Zig Toolchain Install (Dual-Mirror Proof)
        run: |
          echo "================================================================================"
          echo "MOVE 1: ZERO-TRUST DIGEST-PINNED ZIG INSTALLER (DUAL-MIRROR CROSS-VERIFICATION)"
          echo "================================================================================"
          # Target: Zig 0.16.0 on macos-14 (arm64-macos)
          PINNED_VERSION="0.16.0"
          EXPECTED_SHA="b23d70deaa879b5c2d486ed3316f7eaa53e84acf6fc9cc747de152450d401489"
          TARBALL="zig-aarch64-macos-${PINNED_VERSION}.tar.xz"
          PRIMARY_URL="https://ziglang.org/download/${PINNED_VERSION}/${TARBALL}"
          MIRROR_URL="https://pkg.hexops.org/zig/${TARBALL}"
          
          mkdir -p /tmp/zig_stage /tmp/zig_install
          
          echo "[*] Step 1.1: Fetching primary release tarball from ziglang.org..."
          curl -sSL --retry 3 --max-time 120 "$PRIMARY_URL" -o /tmp/zig_stage/primary.tar.xz
          PRIMARY_SHA=$(shasum -a 256 /tmp/zig_stage/primary.tar.xz | awk '{print $1}')
          echo "    - Primary SHA-256: $PRIMARY_SHA"
          if [ "$PRIMARY_SHA" != "$EXPECTED_SHA" ]; then
            echo "❌ FATAL: Primary checksum mismatch against hardcoded pin!"
            echo "    Expected: $EXPECTED_SHA"
            echo "    Actual:   $PRIMARY_SHA"
            exit 1
          fi
          echo "    [PASS] Primary checksum matches hardcoded bitstring."

          echo "[*] Step 1.2: Cross-verifying against independent mirror (pkg.hexops.org)..."
          curl -sSL --retry 3 --max-time 120 "$MIRROR_URL" -o /tmp/zig_stage/mirror.tar.xz
          MIRROR_SHA=$(shasum -a 256 /tmp/zig_stage/mirror.tar.xz | awk '{print $1}')
          echo "    - Mirror SHA-256:  $MIRROR_SHA"
          if [ "$MIRROR_SHA" != "$EXPECTED_SHA" ]; then
            echo "❌ FATAL: Mirror checksum mismatch against hardcoded pin!"
            echo "    Expected: $EXPECTED_SHA"
            echo "    Actual:   $MIRROR_SHA"
            exit 1
          fi
          echo "    [PASS] Mirror checksum matches hardcoded bitstring."

          echo "[*] Step 1.3: Differential byte audit between mirrors (cmp -l)..."
          DIFF_BYTES=$(cmp -l /tmp/zig_stage/primary.tar.xz /tmp/zig_stage/mirror.tar.xz | wc -l | tr -d ' ')
          echo "    - cmp -l difference: $DIFF_BYTES differing bytes"
          if [ "$DIFF_BYTES" -ne 0 ]; then
            echo "❌ FATAL: Non-deterministic tarball payload across mirrors!"
            exit 1
          fi
          echo "    [PASS] Zero bit divergence between mirrors."

          echo "[*] Step 1.4: Extracting and registering toolchain..."
          tar -xf /tmp/zig_stage/primary.tar.xz -C /tmp/zig_stage
          cp -R /tmp/zig_stage/zig-aarch64-macos-${PINNED_VERSION}/* /tmp/zig_install/
          echo "/tmp/zig_install" >> $GITHUB_PATH
          export PATH="/tmp/zig_install:$PATH"
          
          INSTALLED_VERSION=$(/tmp/zig_install/zig version)
          echo "    - Verified Installed Version: $INSTALLED_VERSION"
          if [ "$INSTALLED_VERSION" != "$PINNED_VERSION" ]; then
            echo "❌ FATAL: Installed version mismatch!"
            exit 1
          fi
          echo ">>> MOVE 1 COMPLETE: EXACT PROVEN BITSTRING INSTALLED."

      - name: Execute 5-Move Deterministic Reproducibility Engine
        run: |
          chmod +x ops/reproducibility/reproducible_build_engine.sh
          bash ops/reproducibility/reproducible_build_engine.sh

      - name: Execute CI Isolated Dual-Sandbox Differential Audit
        run: |
          chmod +x ops/reproducibility/ci_reproducible_build_step.sh
          bash ops/reproducibility/ci_reproducible_build_step.sh

      - name: Raw Upstream Z3 SMT-LIB v2 Formal Bitvector Containment Proof
        run: |
          echo "================================================================================"
          echo "  RAW UPSTREAM Z3 SMT-LIB v2 FORMAL BITVECTOR CONTAINMENT PROOF                 "
          echo "================================================================================"
          # Ensure z3 binary exists on runner
          if ! command -v z3 &> /dev/null; then
            echo "[*] Installing Z3 SMT solver via brew..."
            brew install z3
          fi
          
          echo "[*] Z3 Binary: $(which z3) ($(z3 --version))"
          SMT_FILE="core/ops/security/upgp_containment_proof.smt2"
          
          if [ ! -f "$SMT_FILE" ]; then
            echo "❌ FATAL: SMT2 proof file not found at $SMT_FILE"
            exit 1
          fi
          
          echo "[*] Executing raw Z3 binary directly against $SMT_FILE (Zero Python / Zero Swarm)..."
          RESULT=$(z3 "$SMT_FILE")
          echo "    - Solver Output: '$RESULT'"
          
          if [ "$RESULT" != "unsat" ]; then
            echo "❌ FATAL: Z3 containment proof failed! Expected 'unsat', got '$RESULT'"
            exit 1
          fi
          
          echo ">>> MATHEMATICAL CONTAINMENT PROVEN: Z3 RETURNED UNSAT AT LINE RATE."

      - name: Verify Standalone Evidence Ledger Integrity
        run: |
          python3 ops/provenance/evidence_ledger.py verify --no-evidence
          python3 ops/provenance/evidence_ledger.py selftest

