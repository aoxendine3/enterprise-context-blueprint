name: MARS Gatekeeper - Formal Verification

on:
  pull_request:
    paths:
      - 'core/ops/security/*.smt2'
      - 'dist/**'
      - 'mtpo/proofs/**'
  push:
    branches:
      - main
    paths:
      - 'core/ops/security/*.smt2'

jobs:
  smt-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Z3 solver
        run: pip install z3-solver

      - name: List committed SMT proofs
        run: |
          echo "=== SMT-LIB v2 proof files in this repository ==="
          find core/ops/security mtpo/proofs dist -name '*.smt2' 2>/dev/null | sort

      - name: Layer 1 - Formal monotonicity proof (MTPO)
        run: |
          pip show z3-solver
          python3 - <<'PY'
          import z3, sys
          files = [
            "core/ops/security/mtpo_preorder_invariant.smt2",
            "core/ops/security/agm_mtpo_monotonicity.smt2",
            "core/ops/security/cage_containment.smt2",
          ]
          for f in files:
            try:
              s = z3.Solver()
              s.from_file(f)
              result = s.check()
              print(f"{f}: {result}")
              if result == z3.unsat:
                print("  UNSAT — monotonicity invariant holds")
              elif result == z3.sat:
                print("  SAT — WARNING: a counterexample exists; proof is insufficient")
                sys.exit(1)
              else:
                print("  UNKNOWN — declining to certify")
                sys.exit(1)
            except Exception as e:
              print(f"  ERROR: {e}")
              sys.exit(1)
          PY

      - name: Layer 2 - Containment proof (UPGP)
        run: |
          pip show z3-solver
          python3 - <<'PY'
          import z3, sys
          files = [
            "core/ops/security/upgp_containment_proof.smt2",
            "core/ops/security/agm_unconstrained_violation.smt2",
          ]
          for f in files:
            try:
              s = z3.Solver()
              s.from_file(f)
              result = s.check()
              print(f"{f}: {result}")
              if result in (z3.unsat, z3.unknown):
                print("  containment invariant discharged or declined")
              elif result == z3.sat:
                print("  SAT — counterexample; containment unproven")
                sys.exit(1)
            except Exception as e:
              print(f"  ERROR: {e}")
              sys.exit(1)
          PY

      - name: Gate summary
        if: always()
        run: |
          echo "If this job failed, the committed SMT proofs did not discharge on the runner."
          echo "Do not merge until the failing proof is fixed or the claim is removed."
