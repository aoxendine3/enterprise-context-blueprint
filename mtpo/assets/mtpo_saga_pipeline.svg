<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="mtpoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="p2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="p3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="pRollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="960" height="480" rx="16" fill="url(#mtpoBg)" stroke="#374151" stroke-width="2"/>

  <text x="480" y="55" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#f3f4f6" letter-spacing="1.5">
    MTPO: 3-PHASE SAGA CONCURRENCY ENGINE
  </text>
  <text x="480" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#9ca3af" letter-spacing="1">
    LOCK-FREE ATOMIC STATE MACHINE (RESERVE ➔ MUTATE ➔ COMMIT / COMPENSATE)
  </text>

  <!-- Phase 1: Reserve -->
  <g transform="translate(60, 130)">
    <rect width="220" height="240" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="34" rx="10" fill="url(#p1Grad)"/>
    <text x="110" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      PHASE 1: RESERVE
    </text>
    <text x="110" y="65" text-anchor="middle" font-family="monospace" font-size="11" fill="#93c5fd">
      SAGA_RESERVED
    </text>
    <text x="110" y="95" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      • Optimistic Slot Lease
    </text>
    <text x="110" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      • Snapshot Initial Value
    </text>
    <text x="110" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      • Memory Order Acquire
    </text>
    <rect x="25" y="175" width="170" height="35" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="110" y="197" text-anchor="middle" font-family="monospace" font-size="10" fill="#60a5fa">
      atomic_load_explicit()
    </text>
  </g>

  <!-- Arrow P1 -> P2 -->
  <path d="M 290 250 L 340 250" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Phase 2: Mutate -->
  <g transform="translate(350, 130)">
    <rect width="240" height="240" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="0" y="0" width="240" height="34" rx="10" fill="url(#p2Grad)"/>
    <text x="120" y="22" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      PHASE 2: MUTATE
    </text>
    <text x="120" y="65" text-anchor="middle" font-family="monospace" font-size="11" fill="#c4b5fd">
      SAGA_MUTATING
    </text>
    <text x="120" y="95" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      • Isolated Shadow Register
    </text>
    <text x="120" y="120" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      • Zero Active State Dirtying
    </text>
    <text x="120" y="145" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#cbd5e1">
      • Cache-Line Aligned (64B)
    </text>
    <rect x="25" y="175" width="190" height="35" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="120" y="197" text-anchor="middle" font-family="monospace" font-size="10" fill="#a78bfa">
      shadow_slots[i] = new_val
    </text>
  </g>

  <!-- Arrow Split P2 -> P3A & P3B -->
  <path d="M 600 220 L 670 190" stroke="#10b981" stroke-width="2" stroke-dasharray="4 2"/>
  <path d="M 600 280 L 670 310" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Phase 3A: Commit -->
  <g transform="translate(680, 110)">
    <rect width="220" height="120" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="28" rx="8" fill="url(#p3Grad)"/>
    <text x="110" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#000000">
      PHASE 3A: ATOMIC COMMIT
    </text>
    <text x="110" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#6ee7b7">
      atomic_compare_exchange()
    </text>
    <text x="110" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#d1fae5">
      Active slot updated atomically
    </text>
    <text x="110" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#34d399">
      100% Zero-Lock Dispatch
    </text>
  </g>

  <!-- Phase 3B: Compensate -->
  <g transform="translate(680, 260)">
    <rect width="220" height="120" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="28" rx="8" fill="url(#pRollGrad)"/>
    <text x="110" y="18" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff">
      PHASE 3B: COMPENSATE (ROLL)
    </text>
    <text x="110" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#fca5a5">
      SAGA_COMPENSATED
    </text>
    <text x="110" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#fee2e2">
      Shadow slot reverted to snapshot
    </text>
    <text x="110" y="100" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#f87171">
      Guaranteed Crash Atomicity
    </text>
  </g>
</svg>
