<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <linearGradient id="ringBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" rx="12" fill="url(#ringBg)" stroke="#334155" stroke-width="1.5"/>

  <text x="320" y="40" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
    HEXCELL 6-FOLD SYMMETRICAL LOCK-FREE TOPOLOGY
  </text>
  <text x="320" y="62" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">
    64-BYTE CACHE-LINE ALIGNED ATOMIC RING BUFFER
  </text>

  <!-- Central Hub -->
  <circle cx="320" cy="230" r="48" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
  <text x="320" y="226" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#60a5fa">CORE</text>
  <text x="320" y="242" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">ATOMIC</text>

  <!-- 6 Hexagonal Nodes (R = 120, center 320, 230) -->
  <!-- Angles: 0, 60, 120, 180, 240, 300 deg -->
  <!-- Node 0: (440, 230) -->
  <line x1="320" y1="230" x2="440" y2="230" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="440" cy="230" r="32" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="440" y="226" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">HEX-0</text>
  <text x="440" y="240" text-anchor="middle" font-family="monospace" font-size="8" fill="#a7f3d0">SLOT 0</text>

  <!-- Node 1: (380, 126) -->
  <line x1="320" y1="230" x2="380" y2="126" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="380" cy="126" r="32" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="380" y="122" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">HEX-1</text>
  <text x="380" y="136" text-anchor="middle" font-family="monospace" font-size="8" fill="#a7f3d0">SLOT 1</text>

  <!-- Node 2: (260, 126) -->
  <line x1="320" y1="230" x2="260" y2="126" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="260" cy="126" r="32" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="260" y="122" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">HEX-2</text>
  <text x="260" y="136" text-anchor="middle" font-family="monospace" font-size="8" fill="#a7f3d0">SLOT 2</text>

  <!-- Node 3: (200, 230) -->
  <line x1="320" y1="230" x2="200" y2="230" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="200" cy="230" r="32" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="200" y="226" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">HEX-3</text>
  <text x="200" y="240" text-anchor="middle" font-family="monospace" font-size="8" fill="#a7f3d0">SLOT 3</text>

  <!-- Node 4: (260, 334) -->
  <line x1="320" y1="230" x2="260" y2="334" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="260" cy="334" r="32" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="260" y="330" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">HEX-4</text>
  <text x="260" y="344" text-anchor="middle" font-family="monospace" font-size="8" fill="#a7f3d0">SLOT 4</text>

  <!-- Node 5: (380, 334) -->
  <line x1="320" y1="230" x2="380" y2="334" stroke="#475569" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="380" cy="334" r="32" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
  <text x="380" y="330" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#34d399">HEX-5</text>
  <text x="380" y="344" text-anchor="middle" font-family="monospace" font-size="8" fill="#a7f3d0">SLOT 5</text>

  <!-- Ring Connecting Periphery -->
  <polygon points="440,230 380,126 260,126 200,230 260,334 380,334" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 2"/>
</svg>
