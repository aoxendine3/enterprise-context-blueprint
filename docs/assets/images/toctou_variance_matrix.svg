<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="redBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="meanBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="958" height="538" rx="15" fill="none" stroke="#1f2937" stroke-width="2"/>

  <!-- Header -->
  <text x="40" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#f9fafb" letter-spacing="-0.5">SECCOMP_RET_USER_NOTIF: TOCTOU Exploit Success Across 7 CPU Topologies</text>
  <text x="40" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#9ca3af">140,000 Total Physical Cycles (20,000 per regime) • Sample Mean μ = 71.16%, σ = 8.71% • Receipt Hash: 9c7b23f7...</text>

  <!-- Grid lines -->
  <g stroke="#1f2937" stroke-dasharray="4,4" stroke-width="1">
    <line x1="300" y1="100" x2="300" y2="470"/>
    <line x1="430" y1="100" x2="430" y2="470"/>
    <line x1="560" y1="100" x2="560" y2="470"/>
    <line x1="690" y1="100" x2="690" y2="470"/>
    <line x1="820" y1="100" x2="820" y2="470"/>
  </g>

  <!-- Grid Labels -->
  <g font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6b7280" text-anchor="middle">
    <text x="300" y="490">0%</text>
    <text x="430" y="490">25%</text>
    <text x="560" y="490">50%</text>
    <text x="690" y="490">75%</text>
    <text x="820" y="490">100%</text>
  </g>

  <!-- Bars Group -->
  <!-- Formula for width: width = (rate / 100) * 520 px. Base X = 300 -->

  <!-- Top-01: Cross-Core Asymmetric 59.11% -> 307.3px -->
  <text x="40" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#e5e7eb">1. Cross-Core Asymmetric</text>
  <rect x="300" y="116" width="307" height="22" rx="4" fill="url(#redBar)" filter="url(#shadow)"/>
  <text x="618" y="132" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f87171">59.11% (11,823 / 20k)</text>

  <!-- Top-02: Pinned Same Cluster (Shared L2) 83.26% -> 433.0px -->
  <text x="40" y="172" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600" fill="#fca5a5">2. Pinned Same Cluster (Shared L2)</text>
  <rect x="300" y="156" width="433" height="22" rx="4" fill="url(#redBar)" filter="url(#shadow)"/>
  <text x="744" y="172" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#ef4444">83.26% (16,652 / 20k) [WORST CASE]</text>

  <!-- Top-03: Cross-Cluster (NUMA Sim) 76.69% -> 398.8px -->
  <text x="40" y="212" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#e5e7eb">3. Cross-Cluster (NUMA-Sim)</text>
  <rect x="300" y="196" width="399" height="22" rx="4" fill="url(#redBar)" filter="url(#shadow)"/>
  <text x="710" y="212" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f87171">76.69% (15,338 / 20k)</text>

  <!-- Top-04: Sched Yield Jitter 64.25% -> 334.1px -->
  <text x="40" y="252" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#e5e7eb">4. Sched Yield Jitter</text>
  <rect x="300" y="236" width="334" height="22" rx="4" fill="url(#redBar)" filter="url(#shadow)"/>
  <text x="645" y="252" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f87171">64.25% (12,850 / 20k)</text>

  <!-- Top-05: High Bus Contention 63.52% -> 330.3px -->
  <text x="40" y="292" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#e5e7eb">5. High Bus Contention</text>
  <rect x="300" y="276" width="330" height="22" rx="4" fill="url(#redBar)" filter="url(#shadow)"/>
  <text x="641" y="292" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f87171">63.52% (12,704 / 20k)</text>

  <!-- Top-06: Tight Inspection Window 75.38% -> 392.0px -->
  <text x="40" y="332" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#e5e7eb">6. Tight Window (&lt;1µs)</text>
  <rect x="300" y="316" width="392" height="22" rx="4" fill="url(#redBar)" filter="url(#shadow)"/>
  <text x="703" y="332" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f87171">75.38% (15,075 / 20k)</text>

  <!-- Top-07: Wide Inspection Window 75.91% -> 394.7px -->
  <text x="40" y="372" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#e5e7eb">7. Wide Window (&gt;5µs)</text>
  <rect x="300" y="356" width="395" height="22" rx="4" fill="url(#redBar)" filter="url(#shadow)"/>
  <text x="706" y="372" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#f87171">75.91% (15,181 / 20k)</text>

  <!-- Divider -->
  <line x1="40" y1="396" x2="920" y2="396" stroke="#374151" stroke-width="1"/>

  <!-- Aggregate Baseline: 71.16% -> 370.0px -->
  <text x="40" y="422" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">USER SUPERVISOR MEAN (AGGREGATE)</text>
  <rect x="300" y="406" width="370" height="22" rx="4" fill="url(#meanBar)" filter="url(#shadow)"/>
  <text x="682" y="422" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#fbbf24">71.16% (99,623 / 140,000)</text>

  <!-- UPGP v4.0 Ultra: 0.00% -->
  <text x="40" y="458" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#34d399">UPGP v4.0 ULTRA (IN-KERNEL BPF)</text>
  <rect x="300" y="442" width="6" height="22" rx="3" fill="url(#greenBar)"/>
  <text x="318" y="458" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#34d399">0.00% (0 / 10,000 ESCAPES) • ATOMIC SNAPSHOT SEALED</text>
</svg>
