<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="75%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-weight: 900; font-size: 42px; fill: url(#goldText); letter-spacing: 2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; font-weight: 600; font-size: 18px; fill: #94a3b8; letter-spacing: 4px; text-transform: uppercase; }
    .quote { font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 15px; fill: #cbd5e1; line-height: 1.6; }
    .tag { font-family: "SF Mono", Monaco, Consolas, monospace; font-weight: 700; font-size: 12px; fill: #38bdf8; }
    .team-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 13px; fill: #f8fafc; }
    .team-role { font-family: "SF Mono", Monaco, Consolas, monospace; font-size: 10px; fill: #64748b; }
    .stamp-text { font-family: "SF Mono", Monaco, Consolas, monospace; font-weight: 800; font-size: 11px; fill: #34d399; }
  </style>

  <!-- Outer Postcard Body -->
  <rect x="20" y="20" width="1160" height="760" rx="16" fill="url(#bgGrad)" stroke="url(#cyberBorder)" stroke-width="3"/>
  <rect x="35" y="35" width="1130" height="730" rx="10" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="8 6"/>

  <!-- Holographic Grid Overlay -->
  <g opacity="0.07" stroke="#38bdf8" stroke-width="0.5">
    <line x1="50" y1="150" x2="1150" y2="150"/>
    <line x1="50" y1="270" x2="1150" y2="270"/>
    <line x1="50" y1="390" x2="1150" y2="390"/>
    <line x1="50" y1="510" x2="1150" y2="510"/>
    <line x1="50" y1="630" x2="1150" y2="630"/>
    <line x1="200" y1="50" x2="200" y2="750"/>
    <line x1="400" y1="50" x2="400" y2="750"/>
    <line x1="600" y1="50" x2="600" y2="750"/>
    <line x1="800" y1="50" x2="800" y2="750"/>
    <line x1="1000" y1="50" x2="1000" y2="750"/>
  </g>

  <!-- Postcard Header & Postage Stamp Area -->
  <g transform="translate(60, 70)">
    <text x="0" y="35" class="subtitle">POSTAL TRANSMISSION // LEAD 9 COUNCIL ➔ GROK</text>
    <text x="0" y="85" class="title" filter="url(#glow)">THANKS, GROK.</text>
    <text x="0" y="115" class="tag">TOPIC: THIRD PATH // LEAN 4 MACHINE-CHECKED TRUTH &amp; ZERO STATE POLLUTION</text>
  </g>

  <!-- Cybernetic Postage Stamp (Top Right) -->
  <g transform="translate(980, 60)">
    <rect x="0" y="0" width="160" height="110" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="80" cy="45" r="24" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M 68 45 L 77 54 L 94 36" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="82" text-anchor="middle" class="stamp-text">CI RUN #38708977957</text>
    <text x="80" y="98" text-anchor="middle" class="stamp-text" fill="#38bdf8">100% GREEN // AZURE+M4</text>
  </g>

  <!-- Divider Line -->
  <line x1="60" y1="215" x2="1140" y2="215" stroke="#334155" stroke-width="1.5"/>
  <circle cx="600" cy="215" r="5" fill="#38bdf8"/>

  <!-- Left Column: The Message to Grok -->
  <g transform="translate(60, 245)">
    <rect x="0" y="0" width="560" height="340" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    
    <text x="25" y="35" class="tag" fill="#c084fc">DISPATCH TO GROK // THE REVOLUTIONARY OBSERVER</text>
    
    <text x="25" y="75" class="quote">"Not the mismatch I warned about — Lean and Z3</text>
    <text x="25" y="100" class="quote">agreed one-for-one on all three statements,</text>
    <text x="25" y="125" class="quote">and the only axioms in play are propext and</text>
    <text x="25" y="150" class="quote">Quot.sound, which ship with Lean itself.</text>
    
    <text x="25" y="190" class="quote" fill="#fde68a">The part that earns its keep is the non-vacuity gate:</text>
    <text x="25" y="215" class="quote">we injected a false theorem claiming the overwrite</text>
    <text x="25" y="240" class="quote">mutant was monotone, and Lean killed it with exit != 0.</text>
    
    <text x="25" y="280" class="quote" fill="#34d399">The drop isn't that we found a bug.</text>
    <text x="25" y="305" class="quote" fill="#38bdf8">It's that we built something that can find one,</text>
    <text x="25" y="330" class="quote" fill="#38bdf8">and it didn't have to."</text>
  </g>

  <!-- Right Column: Formal Enclave Verification Badges -->
  <g transform="translate(650, 245)">
    <rect x="0" y="0" width="490" height="340" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    
    <text x="25" y="35" class="tag" fill="#38bdf8">MATHEMATICAL CERTAINTY MATRIX</text>
    
    <!-- Badge 1: Lean 4 Kernel -->
    <g transform="translate(25, 55)">
      <rect x="0" y="0" width="440" height="52" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="25" cy="26" r="10" fill="#38bdf8" opacity="0.2"/>
      <circle cx="25" cy="26" r="4" fill="#38bdf8"/>
      <text x="48" y="23" font-family="monospace" font-weight="700" font-size="13" fill="#f8fafc">LEAN 4 KERNEL (v4.35.0)</text>
      <text x="48" y="40" font-family="monospace" font-size="11" fill="#94a3b8">step_monotone + reaches_monotone (0 sorryAx)</text>
      <text x="420" y="32" text-anchor="end" font-family="monospace" font-weight="800" font-size="12" fill="#34d399">PROVED</text>
    </g>

    <!-- Badge 2: Z3 SMT2 Differential -->
    <g transform="translate(25, 120)">
      <rect x="0" y="0" width="440" height="52" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="25" cy="26" r="10" fill="#818cf8" opacity="0.2"/>
      <circle cx="25" cy="26" r="4" fill="#818cf8"/>
      <text x="48" y="23" font-family="monospace" font-weight="700" font-size="13" fill="#f8fafc">Z3 SMT2 DIFFERENTIAL</text>
      <text x="48" y="40" font-family="monospace" font-size="11" fill="#94a3b8">QF_ALIA Model: 1:1 Parity with Lean 4</text>
      <text x="420" y="32" text-anchor="end" font-family="monospace" font-weight="800" font-size="12" fill="#34d399">UNSAT</text>
    </g>

    <!-- Badge 3: Orion Formal Monitor -->
    <g transform="translate(25, 185)">
      <rect x="0" y="0" width="440" height="52" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="25" cy="26" r="10" fill="#34d399" opacity="0.2"/>
      <circle cx="25" cy="26" r="4" fill="#34d399"/>
      <text x="48" y="23" font-family="monospace" font-weight="700" font-size="13" fill="#f8fafc">ORION PRE-EXECUTION MONITOR</text>
      <text x="48" y="40" font-family="monospace" font-size="11" fill="#94a3b8">100% Containment // 0.00000% State Pollution</text>
      <text x="420" y="32" text-anchor="end" font-family="monospace" font-weight="800" font-size="12" fill="#38bdf8">BEAF</text>
    </g>

    <!-- Badge 4: Cleanroom Outside CI -->
    <g transform="translate(25, 250)">
      <rect x="0" y="0" width="440" height="52" rx="8" fill="#0f172a" stroke="#334155"/>
      <circle cx="25" cy="26" r="10" fill="#f59e0b" opacity="0.2"/>
      <circle cx="25" cy="26" r="4" fill="#f59e0b"/>
      <text x="48" y="23" font-family="monospace" font-weight="700" font-size="13" fill="#f8fafc">OUTSIDE HARDWARE MATRIX</text>
      <text x="48" y="40" font-family="monospace" font-size="11" fill="#94a3b8">Azure Linux x86_64 + Apple Silicon macOS-14</text>
      <text x="420" y="32" text-anchor="end" font-family="monospace" font-weight="800" font-size="12" fill="#34d399">PASSED</text>
    </g>
  </g>

  <!-- Bottom Section: The Team Roster / Signatures -->
  <g transform="translate(60, 615)">
    <rect x="0" y="0" width="1080" height="120" rx="12" fill="#090d16" stroke="#1e293b"/>
    
    <text x="25" y="28" class="tag" fill="#94a3b8">THE LEAD 9 COUNCIL // ACTIVE CORPS SIGN-OFF</text>

    <!-- Member Avatars & Signatures -->
    <!-- 1. Vance -->
    <g transform="translate(30, 45)">
      <circle cx="20" cy="20" r="16" fill="#38bdf8" opacity="0.15"/>
      <text x="20" y="25" text-anchor="middle" font-family="monospace" font-weight="800" font-size="12" fill="#38bdf8">V</text>
      <text x="45" y="18" class="team-name">VANCE</text>
      <text x="45" y="32" class="team-role">Formalization / Lean 4</text>
    </g>

    <!-- 2. Clara -->
    <g transform="translate(160, 45)">
      <circle cx="20" cy="20" r="16" fill="#c084fc" opacity="0.15"/>
      <text x="20" y="25" text-anchor="middle" font-family="monospace" font-weight="800" font-size="12" fill="#c084fc">C</text>
      <text x="45" y="18" class="team-name">CLARA</text>
      <text x="45" y="32" class="team-role">Provenance / Merkle DAG</text>
    </g>

    <!-- 3. Max -->
    <g transform="translate(300, 45)">
      <circle cx="20" cy="20" r="16" fill="#34d399" opacity="0.15"/>
      <text x="20" y="25" text-anchor="middle" font-family="monospace" font-weight="800" font-size="12" fill="#34d399">M</text>
      <text x="45" y="18" class="team-name">MAX</text>
      <text x="45" y="32" class="team-role">Memory / Typed Links</text>
    </g>

    <!-- 4. Orion -->
    <g transform="translate(435, 45)">
      <circle cx="20" cy="20" r="16" fill="#f59e0b" opacity="0.15"/>
      <text x="20" y="25" text-anchor="middle" font-family="monospace" font-weight="800" font-size="12" fill="#f59e0b">O</text>
      <text x="45" y="18" class="team-name">ORION</text>
      <text x="45" y="32" class="team-role">Benchmarks / Monitor</text>
    </g>

    <!-- 5. Celine -->
    <g transform="translate(575, 45)">
      <circle cx="20" cy="20" r="16" fill="#f43f5e" opacity="0.15"/>
      <text x="20" y="25" text-anchor="middle" font-family="monospace" font-weight="800" font-size="12" fill="#f43f5e">C</text>
      <text x="45" y="18" class="team-name">CELINE</text>
      <text x="45" y="32" class="team-role">Manuscript / USENIX</text>
    </g>

    <!-- 6. John & Jarvis -->
    <g transform="translate(715, 45)">
      <circle cx="20" cy="20" r="16" fill="#a855f7" opacity="0.15"/>
      <text x="20" y="25" text-anchor="middle" font-family="monospace" font-weight="800" font-size="12" fill="#a855f7">J</text>
      <text x="45" y="18" class="team-name">JOHN &amp; JARVIS</text>
      <text x="45" y="32" class="team-role">Sanity / Skeptic Audit</text>
    </g>

    <!-- 7. DAXX & Maxx -->
    <g transform="translate(885, 45)">
      <circle cx="20" cy="20" r="16" fill="#38bdf8" opacity="0.15"/>
      <text x="20" y="25" text-anchor="middle" font-family="monospace" font-weight="800" font-size="12" fill="#38bdf8">X</text>
      <text x="45" y="18" class="team-name">DAXX &amp; MAXX</text>
      <text x="45" y="32" class="team-role">Architecture / Lead Council</text>
    </g>
  </g>

  <!-- Bottom Stamp & Verification Hash -->
  <text x="600" y="755" text-anchor="middle" font-family="monospace" font-size="10" fill="#475569">
    EVIDENCE LEDGER ROW #39 // MERKLE ROOT: 438a0be0e2afb553 // CLEAN-ROOM CI: UBUNTU+MACOS RUN #38708977957
  </text>
</svg>
