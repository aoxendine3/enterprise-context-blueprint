[package]
name = "hexological_18432d_engine"
version = "1.0.0"
edition = "2021"
authors = ["Xoras Collective <anthony@xoras.ai>"]
description = "Sovereign 18,432-D Hexological Vectoring Engine in Pure Rust on Apple Silicon M4 Bare Metal"

[dependencies]
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
