name: XORAS Agentic Framework CI/CD

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 build
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 xoras --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 xoras --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Run XORAS AST & Cryptographic Self-Audit
        run: |
          xoras scan xoras/
          xoras scan tests/

      - name: Build Package Artifacts (sdist & wheel)
        run: |
          python -m build
