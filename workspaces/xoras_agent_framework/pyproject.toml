[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xoras-agent-framework"
version = "2.3.0"
description = "Enterprise Multi-Agent Runtime & AST Security Governance Framework"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "XORAS Systems LLC", email = "engineering@xoras.ai" }]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "cryptography>=41.0.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
xoras = "xoras.cli:main"

[tool.setuptools.packages.find]
where = ["."]
