<!DOCTYPE html>
<html>
<head>
    <title>Sovereign Chat Console</title>
    <style>
        body { font-family: monospace; background: #0a0a0a; color: #00ff00; padding: 20px; margin: 0; display: flex; justify-content: center; }
        .container { width: 95%; max-width: 1600px; display: flex; flex-direction: column; height: 90vh; }
        h2 { text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }
        #chat { flex-grow: 1; overflow-y: auto; border: 1px solid #333; padding: 20px; margin-bottom: 15px; background: #111; word-wrap: break-word; white-space: pre-wrap; font-size: 16px; }
        .msg { margin-bottom: 15px; line-height: 1.4; }
        .user { color: #fff; }
        .agent { color: #00ff00; }
        .input-group { display: flex; gap: 15px; }
        input { flex-grow: 1; padding: 15px; font-size: 16px; font-family: monospace; background: #222; color: #0f0; border: 1px solid #333; outline: none; }
        button { padding: 15px 30px; font-size: 16px; font-family: monospace; background: #333; color: #0f0; border: 1px solid #444; cursor: pointer; font-weight: bold; }
        button:hover { background: #444; }
    </style>
</head>
<body>
    <div class="container">
        <h2>XORAS SWARM CONSOLE (RUST/AXUM ENGINE)</h2>
        <div id="chat"></div>
        <div class="input-group">
            <input type="text" id="msg" placeholder="Awaiting input..." onkeypress="if(event.key === 'Enter') send()">
            <button onclick="send()">TRANSMIT</button>
        </div>
    </div>

    <script>
        const sessionId = "sess_" + Math.random().toString(36).substr(2, 9);
        const chat = document.getElementById("chat");
        
        async function send() {
            const input = document.getElementById("msg");
            const text = input.value.trim();
            if(!text) return;
            
            chat.innerHTML += `<div class="msg user"><b>[USER]:</b> ${text}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;
            
            try {
                const res = await fetch("/chat", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({session_id: sessionId, message: text})
                });
                const data = await res.json();
                chat.innerHTML += `<div class="msg agent"><b>[${data.agent.toUpperCase()}]:</b> ${data.reply}</div>`;
            } catch (err) {
                chat.innerHTML += `<div class="msg agent" style="color:red;"><b>[SYSTEM_ERROR]:</b> Connection failed.</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
