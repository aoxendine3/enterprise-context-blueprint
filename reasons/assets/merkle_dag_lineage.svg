<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="100%" height="100%">
  <defs>
    <linearGradient id="dagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#111c30"/>
    </linearGradient>
    <linearGradient id="genesisGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="960" height="460" rx="16" fill="url(#dagBg)" stroke="#374151" stroke-width="2"/>

  <text x="480" y="50" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#f3f4f6" letter-spacing="1.5">
    REASONS: CONTEXT LINEAGE MERKLE DAG ENGINE
  </text>
  <text x="480" y="75" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#9ca3af" letter-spacing="1">
    CRYPTOGRAPHIC ANCESTRY ➔ ANTI-REPLAY ENFORCEMENT ➔ MERKLE ROOT ANCHOR
  </text>

  <!-- Node 0: Genesis -->
  <g transform="translate(60, 180)">
    <rect width="180" height="150" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="28" rx="8" fill="url(#genesisGrad)"/>
    <text x="90" y="19" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#ffffff">GENESIS STATE</text>
    <text x="90" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#a5b4fc">node-00-genesis</text>
    <text x="90" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#cbd5e1">Parents: [0 * 64]</text>
    <text x="90" y="105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#cbd5e1">Payload: Boot Config</text>
    <text x="90" y="130" text-anchor="middle" font-family="monospace" font-size="9" fill="#818cf8">state: #9a4f21...</text>
  </g>

  <!-- Line Genesis -> Node 1 & Node 2 -->
  <path d="M 240 230 L 320 180" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 2"/>
  <path d="M 240 270 L 320 320" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Node 1: Deliberation Branch -->
  <g transform="translate(320, 120)">
    <rect width="190" height="130" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="26" rx="8" fill="url(#nodeGrad)"/>
    <text x="95" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#000000">BRANCH-A (DIAGNOSTIC)</text>
    <text x="95" y="50" text-anchor="middle" font-family="monospace" font-size="10" fill="#bae6fd">node-01-clin-vitals</text>
    <text x="95" y="75" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#f0f9ff">Parent: [node-00-genesis]</text>
    <text x="95" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#7dd3fc">state: #b21e84...</text>
  </g>

  <!-- Node 2: Evidence Branch -->
  <g transform="translate(320, 270)">
    <rect width="190" height="130" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="26" rx="8" fill="url(#nodeGrad)"/>
    <text x="95" y="18" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#000000">BRANCH-B (EVIDENCE)</text>
    <text x="95" y="50" text-anchor="middle" font-family="monospace" font-size="10" fill="#bae6fd">node-02-lab-evidence</text>
    <text x="95" y="75" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#f0f9ff">Parent: [node-00-genesis]</text>
    <text x="95" y="100" text-anchor="middle" font-family="monospace" font-size="9" fill="#7dd3fc">state: #e99120...</text>
  </g>

  <!-- Merge to Node 3 -->
  <path d="M 510 185 L 590 235" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>
  <path d="M 510 335 L 590 275" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Node 3: Synthesized Decision Node -->
  <g transform="translate(590, 180)">
    <rect width="190" height="150" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="190" height="28" rx="8" fill="url(#rootGrad)"/>
    <text x="95" y="19" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#000000">SYNTHESIS TIP</text>
    <text x="95" y="55" text-anchor="middle" font-family="monospace" font-size="10" fill="#a7f3d0">node-03-consensus</text>
    <text x="95" y="80" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#ecfdf5">Parents: [node-01, node-02]</text>
    <text x="95" y="105" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#ecfdf5">Anti-Replay: VERIFIED</text>
    <text x="95" y="130" text-anchor="middle" font-family="monospace" font-size="9" fill="#34d399">state: #1f99c0...</text>
  </g>

  <!-- Line to Merkle Root Anchor -->
  <path d="M 780 255 L 830 255" stroke="#10b981" stroke-width="2"/>

  <!-- Root Anchor -->
  <g transform="translate(830, 205)">
    <circle cx="50" cy="50" r="45" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="50" y="45" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#2dd4bf">MERKLE</text>
    <text x="50" y="60" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#2dd4bf">ROOT</text>
    <text x="50" y="75" text-anchor="middle" font-family="monospace" font-size="8" fill="#99f6e4">SHA-256</text>
  </g>
</svg>
