<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="100%" height="100%">
  <defs>
    <linearGradient id="evBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="720" height="280" rx="12" fill="url(#evBg)" stroke="#334155" stroke-width="1.5"/>

  <text x="360" y="36" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">
    CRYPTOGRAPHIC EVIDENCE CHAIN (Ed25519)
  </text>
  <text x="360" y="56" text-anchor="middle" font-family="monospace" font-size="11" fill="#94a3b8">
    APPEND-ONLY, HASH-CHAINED, MULTI-KEY ATTESTATION LEDGER
  </text>

  <!-- Row 0 -->
  <g transform="translate(40, 80)">
    <rect width="180" height="160" rx="8" fill="#18181b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="24" rx="8" fill="#334155"/>
    <text x="90" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#f1f5f9">ROW #0 (GENESIS)</text>
    <text x="90" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">prev: 00000000...</text>
    <text x="90" y="72" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#e2e8f0">Agent: MAXX</text>
    <text x="90" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#e2e8f0">Verdict: PROVEN</text>
    <text x="90" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="#38bdf8">sig: Ed25519_OK</text>
    <text x="90" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">hash: 4534c1...</text>
  </g>

  <!-- Link 0 -> 1 -->
  <line x1="220" y1="160" x2="270" y2="160" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Row 1 -->
  <g transform="translate(270, 80)">
    <rect width="180" height="160" rx="8" fill="#18181b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="24" rx="8" fill="#334155"/>
    <text x="90" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#f1f5f9">ROW #1</text>
    <text x="90" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#f59e0b">prev: 4534c1...</text>
    <text x="90" y="72" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#e2e8f0">Agent: CLARA</text>
    <text x="90" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#e2e8f0">Verdict: PROVEN</text>
    <text x="90" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="#38bdf8">sig: Ed25519_OK</text>
    <text x="90" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">hash: ed5708...</text>
  </g>

  <!-- Link 1 -> 2 -->
  <line x1="450" y1="160" x2="500" y2="160" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>

  <!-- Row 2 -->
  <g transform="translate(500, 80)">
    <rect width="180" height="160" rx="8" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="24" rx="8" fill="#065f46"/>
    <text x="90" y="16" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#ffffff">ROW #2 (TIP)</text>
    <text x="90" y="48" text-anchor="middle" font-family="monospace" font-size="9" fill="#f59e0b">prev: ed5708...</text>
    <text x="90" y="72" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#e2e8f0">Agent: VANCE</text>
    <text x="90" y="96" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="10" fill="#e2e8f0">Verdict: PROVEN</text>
    <text x="90" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="#38bdf8">sig: Ed25519_OK</text>
    <text x="90" y="144" text-anchor="middle" font-family="monospace" font-size="9" fill="#10b981">hash: 19fdc2...</text>
  </g>
</svg>
