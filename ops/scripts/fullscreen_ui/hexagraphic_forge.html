<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XORAS Hexagraphic Forge</title>
  <style>
    :root {
      --bg: #050913;
      --panel: rgba(11, 18, 30, 0.78);
      --panel-border: rgba(0, 242, 254, 0.26);
      --accent: #00f2fe;
      --accent-2: #2dd4bf;
      --warn: #f59e0b;
      --danger: #ef4444;
      --muted: #93a6c6;
      --text: #f8fbff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(1200px 600px at 20% -10%, rgba(0,242,254,0.15), transparent 70%), var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }

    #shell {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: 64px 1fr;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 14px;
      padding: 14px;
    }

    header {
      grid-column: 1 / -1;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      backdrop-filter: blur(18px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-size: 13px;
      font-weight: 700;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px var(--accent);
    }

    .status-strip {
      display: flex;
      gap: 12px;
      font-size: 11px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .chip {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 5px 10px;
      background: rgba(255,255,255,0.03);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      backdrop-filter: blur(18px);
      overflow: hidden;
      min-height: 0;
    }

    #stage-panel {
      display: grid;
      grid-template-rows: 1fr auto;
      position: relative;
    }

    #stage-bg {
      position: absolute;
      inset: 0;
      opacity: 0.16;
      background-image:
        linear-gradient(30deg, rgba(0,242,254,0.08) 12%, transparent 12.5%, transparent 87%, rgba(0,242,254,0.08) 87.5%, rgba(0,242,254,0.08)),
        linear-gradient(150deg, rgba(0,242,254,0.08) 12%, transparent 12.5%, transparent 87%, rgba(0,242,254,0.08) 87.5%, rgba(0,242,254,0.08)),
        linear-gradient(90deg, rgba(0,242,254,0.06) 2%, transparent 2.5%, transparent 97%, rgba(0,242,254,0.06) 97.5%, rgba(0,242,254,0.06));
      background-size: 30px 52px;
      background-position: 0 0, 0 0, 15px 26px;
      pointer-events: none;
    }

    .stage-top {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-rows: auto 1fr;
      padding: 14px;
      gap: 12px;
      min-height: 0;
    }

    .stage-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    #agent-role {
      color: var(--accent);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    #portrait-wrap {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.45);
      min-height: 0;
    }

    #portrait {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 18%;
      transition: opacity 0.2s ease;
    }

    .stage-caption {
      position: relative;
      z-index: 2;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding: 10px 14px;
      display: grid;
      gap: 7px;
      min-height: 84px;
    }

    #live-transcript {
      font-size: 13px;
      line-height: 1.4;
      color: #dce9ff;
      max-height: 56px;
      overflow: auto;
    }

    #ops-panel {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 0;
    }

    .tabs {
      display: flex;
      gap: 8px;
      padding: 10px 10px 0;
    }

    .tab {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab.active {
      border-color: rgba(0,242,254,0.5);
      color: var(--text);
      box-shadow: 0 0 16px rgba(0,242,254,0.16);
    }

    .tab-view {
      padding: 10px;
      min-height: 0;
      overflow: hidden;
      display: none;
    }

    .tab-view.active { display: grid; }

    #ops-view {
      grid-template-rows: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .metric {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px;
      background: rgba(255,255,255,0.03);
    }

    .metric h4 {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .metric p {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 16px;
      font-weight: 700;
    }

    #ops-log {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 10px;
      background: rgba(0,0,0,0.22);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #dce9ff;
      overflow: auto;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    #game-view {
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }

    .game-controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.04);
      color: var(--text);
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.primary {
      border-color: rgba(0,242,254,0.45);
      box-shadow: 0 0 16px rgba(0,242,254,0.16);
    }

    .btn.warn {
      border-color: rgba(245,158,11,0.45);
    }

    #hex-canvas {
      width: 100%;
      height: 100%;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(8,13,22,0.8), rgba(3,7,14,0.95));
      cursor: crosshair;
    }

    .game-footer {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .game-stat {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px;
      padding: 8px;
      background: rgba(255,255,255,0.03);
    }

    .game-stat .k {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.3px;
      margin-bottom: 3px;
    }

    .game-stat .v {
      font-size: 14px;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body>
  <div id="shell">
    <header>
      <div class="brand">
        <span class="brand-dot"></span>
        <span>XORAS Hexagraphic Forge</span>
      </div>
      <div class="status-strip">
        <span class="chip" id="stage-status">stage: syncing</span>
        <span class="chip" id="voice-status">voice: active</span>
        <span class="chip" id="fps-status">fps: --</span>
      </div>
    </header>

    <section id="stage-panel" class="panel">
      <div id="stage-bg"></div>
      <div class="stage-top">
        <div class="stage-head">
          <span id="agent-role">MAXX</span>
          <span id="stage-clock">--:--:--</span>
        </div>
        <div id="portrait-wrap">
          <img id="portrait" src="/images/maxx.jpg" alt="Active agent portrait">
        </div>
      </div>
      <div class="stage-caption">
        <div id="live-transcript"></div>
      </div>
    </section>

    <section id="ops-panel" class="panel">
      <div class="tabs">
        <button class="tab active" data-tab="ops-view">Operations</button>
        <button class="tab" data-tab="game-view">Hex Arena</button>
      </div>

      <div id="ops-view" class="tab-view active">
        <div class="metric-grid">
          <div class="metric"><h4>CPU</h4><p id="m-cpu">--</p></div>
          <div class="metric"><h4>RAM</h4><p id="m-ram">--</p></div>
          <div class="metric"><h4>Processes</h4><p id="m-proc">--</p></div>
          <div class="metric"><h4>Agent</h4><p id="m-agent">--</p></div>
        </div>
        <div id="ops-log"></div>
      </div>

      <div id="game-view" class="tab-view">
        <div class="game-controls">
          <button class="btn primary" id="btn-start">Start</button>
          <button class="btn" id="btn-pause">Pause</button>
          <button class="btn warn" id="btn-reset">Reset</button>
        </div>
        <canvas id="hex-canvas" width="920" height="540"></canvas>
        <div class="game-footer">
          <div class="game-stat"><div class="k">score</div><div class="v" id="g-score">0</div></div>
          <div class="game-stat"><div class="k">secured</div><div class="v" id="g-secured">0</div></div>
          <div class="game-stat"><div class="k">threat</div><div class="v" id="g-threat">0</div></div>
          <div class="game-stat"><div class="k">integrity</div><div class="v" id="g-integrity">100%</div></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const roster = {
      maxx:  { role: "MAXX / OPS", img: "/images/maxx.jpg" },
      jarvis:{ role: "JARVIS / GOVERNANCE", img: "/images/jarvis.jpg" },
      daxx:  { role: "DAXX / ENGINEERING", img: "/images/daxx.jpg" },
      vance: { role: "VANCE / AUDIT", img: "/images/vance.jpg" },
      clara: { role: "CLARA / RESEARCH", img: "/images/clara.jpg" },
      john:  { role: "JOHN / TELEMETRY", img: "/images/john.jpg" },
      selene:{ role: "SELENE / COMMUNICATION", img: "/images/selene.jpg" },
      orion: { role: "ORION / MEDIA", img: "/images/orion.jpg" },
      eden:  { role: "EDEN / ALIGNMENT", img: "/images/eden.jpg" }
    };

    const state = {
      lastTranscript: "",
      lastAgent: "maxx",
      lastTimingSignature: "",
      logLines: [],
      fps: 0
    };

    function logOps(line) {
      const timestamp = new Date().toLocaleTimeString();
      state.logLines.push("[" + timestamp + "] " + line);
      if (state.logLines.length > 26) state.logLines.shift();
      document.getElementById("ops-log").textContent = state.logLines.join("\n");
    }

    async function fetchText(path) {
      const res = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return "";
      return (await res.text()).trim();
    }

    async function fetchJson(path) {
      const res = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) return null;
      return await res.json();
    }

    async function refreshStage() {
      try {
        const agent = (await fetchText("/current_image.txt")).toLowerCase() || "maxx";
        const transcript = await fetchText("/current_transcript.txt");
        const timing = await fetchJson("/current_timing.json");
        const agentInfo = roster[agent] || roster.maxx;

        if (agent !== state.lastAgent) {
          const portrait = document.getElementById("portrait");
          portrait.style.opacity = "0.15";
          setTimeout(() => {
            portrait.src = agentInfo.img;
            portrait.style.opacity = "1";
          }, 90);
          state.lastAgent = agent;
          document.getElementById("agent-role").textContent = agentInfo.role;
          document.getElementById("m-agent").textContent = agent.toUpperCase();
          logOps("active speaker -> " + agent);
        }

        if (transcript && transcript !== state.lastTranscript) {
          state.lastTranscript = transcript;
          document.getElementById("live-transcript").textContent = transcript;
        }

        const signature = timing ? JSON.stringify([timing.agent, timing.start_time, timing.text]) : "";
        if (signature && signature !== state.lastTimingSignature) {
          state.lastTimingSignature = signature;
          document.getElementById("stage-status").textContent = "stage: live";
        }
      } catch (err) {
        document.getElementById("stage-status").textContent = "stage: offline";
      }
    }

    async function refreshTelemetry() {
      try {
        const data = await fetchJson("/api/telemetry");
        if (!data) {
          document.getElementById("m-cpu").textContent = "n/a";
          document.getElementById("m-ram").textContent = "n/a";
          document.getElementById("m-proc").textContent = "n/a";
          return;
        }
        document.getElementById("m-cpu").textContent = String(data.cpu_percent) + "%";
        document.getElementById("m-ram").textContent = String(data.ram_used_gb) + " / " + String(data.ram_total_gb) + " GB";
        document.getElementById("m-proc").textContent = String(data.proc_count);
        document.getElementById("voice-status").textContent = "voice: " + (data.orchestrator_status ? "active" : "unknown");
      } catch (err) {
        document.getElementById("voice-status").textContent = "voice: check";
      }
    }

    function initTabs() {
      const tabs = Array.from(document.querySelectorAll(".tab"));
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          const views = Array.from(document.querySelectorAll(".tab-view"));
          views.forEach((view) => view.classList.remove("active"));
          document.getElementById(tab.dataset.tab).classList.add("active");
        });
      });
    }

    function initClock() {
      setInterval(() => {
        document.getElementById("stage-clock").textContent = new Date().toLocaleTimeString();
      }, 250);
    }

    // Hex Arena mini game (template foundation)
    const game = {
      running: false,
      paused: false,
      score: 0,
      secured: 0,
      threat: 0,
      integrity: 100,
      hexes: [],
      cols: 12,
      rows: 7,
      radius: 24,
      canvas: null,
      ctx: null,
      lastThreatAt: 0
    };

    function hexPath(ctx, x, y, r) {
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (Math.PI / 180) * (60 * i - 30);
        const px = x + r * Math.cos(angle);
        const py = y + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
    }

    function initHexes() {
      game.hexes = [];
      const xStep = game.radius * 1.75;
      const yStep = game.radius * 1.5;
      const xOffset = 56;
      const yOffset = 56;
      for (let row = 0; row < game.rows; row++) {
        for (let col = 0; col < game.cols; col++) {
          const x = xOffset + col * xStep + (row % 2 ? xStep / 2 : 0);
          const y = yOffset + row * yStep;
          game.hexes.push({ x, y, row, col, state: "neutral", pulse: 0 });
        }
      }
      game.score = 0;
      game.secured = 0;
      game.threat = 0;
      game.integrity = 100;
      syncGameHud();
    }

    function syncGameHud() {
      document.getElementById("g-score").textContent = String(game.score);
      document.getElementById("g-secured").textContent = String(game.secured);
      document.getElementById("g-threat").textContent = String(game.threat);
      document.getElementById("g-integrity").textContent = String(Math.max(0, game.integrity)) + "%";
    }

    function randomThreat() {
      const neutral = game.hexes.filter((h) => h.state !== "threat");
      if (!neutral.length) return;
      const pick = neutral[Math.floor(Math.random() * neutral.length)];
      pick.state = "threat";
      pick.pulse = 1.0;
      game.threat += 1;
      game.integrity -= 2;
      syncGameHud();
    }

    function handleCanvasClick(evt) {
      if (!game.running || game.paused) return;
      const rect = game.canvas.getBoundingClientRect();
      const cx = evt.clientX - rect.left;
      const cy = evt.clientY - rect.top;
      for (const hex of game.hexes) {
        const dx = cx - hex.x;
        const dy = cy - hex.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist <= game.radius) {
          if (hex.state === "threat") {
            hex.state = "secured";
            game.score += 30;
            game.secured += 1;
            game.threat = Math.max(0, game.threat - 1);
            syncGameHud();
          } else if (hex.state === "neutral") {
            hex.state = "secured";
            game.score += 10;
            game.secured += 1;
            syncGameHud();
          }
          return;
        }
      }
    }

    function drawHexArena(ts) {
      const ctx = game.ctx;
      if (!ctx) return;
      ctx.clearRect(0, 0, game.canvas.width, game.canvas.height);

      if (game.running && !game.paused) {
        if (ts - game.lastThreatAt > 1800) {
          randomThreat();
          game.lastThreatAt = ts;
        }
        if (game.integrity <= 0) {
          game.running = false;
          logOps("hex arena halted: integrity depleted");
        }
      }

      for (const hex of game.hexes) {
        let stroke = "rgba(0,242,254,0.22)";
        let fill = "rgba(0,242,254,0.05)";
        if (hex.state === "secured") {
          stroke = "rgba(45,212,191,0.65)";
          fill = "rgba(45,212,191,0.18)";
        } else if (hex.state === "threat") {
          hex.pulse = Math.max(0, hex.pulse - 0.03);
          const alpha = 0.22 + hex.pulse * 0.45;
          stroke = "rgba(239,68,68,0.9)";
          fill = "rgba(239,68,68," + alpha.toFixed(3) + ")";
        }
        hexPath(ctx, hex.x, hex.y, game.radius);
        ctx.fillStyle = fill;
        ctx.strokeStyle = stroke;
        ctx.lineWidth = 1.4;
        ctx.fill();
        ctx.stroke();
      }

      requestAnimationFrame(drawHexArena);
    }

    function initGame() {
      game.canvas = document.getElementById("hex-canvas");
      game.ctx = game.canvas.getContext("2d");
      initHexes();
      game.canvas.addEventListener("click", handleCanvasClick);

      document.getElementById("btn-start").addEventListener("click", () => {
        game.running = true;
        game.paused = false;
        logOps("hex arena started");
      });
      document.getElementById("btn-pause").addEventListener("click", () => {
        game.paused = !game.paused;
        logOps(game.paused ? "hex arena paused" : "hex arena resumed");
      });
      document.getElementById("btn-reset").addEventListener("click", () => {
        initHexes();
        game.running = false;
        game.paused = false;
        logOps("hex arena reset");
      });

      requestAnimationFrame(drawHexArena);
    }

    function initFpsCounter() {
      let last = performance.now();
      let frames = 0;
      setInterval(() => {
        document.getElementById("fps-status").textContent = "fps: " + String(state.fps);
      }, 1000);

      function step(now) {
        frames += 1;
        if (now - last >= 1000) {
          state.fps = frames;
          frames = 0;
          last = now;
        }
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function bootstrap() {
      initTabs();
      initClock();
      initGame();
      initFpsCounter();
      logOps("hexagraphic forge ready");
      refreshStage();
      refreshTelemetry();
      setInterval(refreshStage, 900);
      setInterval(refreshTelemetry, 2500);
    }

    bootstrap();
  </script>
</body>
</html>
