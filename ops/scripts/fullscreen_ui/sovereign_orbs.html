<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XORAS — Control Room</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&display=swap');

        :root {
            --font-mono: 'JetBrains Mono', monospace;
            --slate: #8A8D98;
            --steel: #464853;
            --bg-void: #060608;
            --accent: #00E5FF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100vw; height: 100vh; overflow: hidden;
            background: var(--bg-void);
            font-family: var(--font-mono);
            color: var(--slate);
            -webkit-font-smoothing: antialiased;
        }

        canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
        }

        /* Overlay UI - Extreme Minimalist */
        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Top HUD */
        .hud-top {
            padding: 24px 32px;
            display: flex; justify-content: space-between;
            font-size: 10px; font-weight: 500; letter-spacing: 2px;
            text-transform: uppercase; color: var(--steel);
        }
        
        .agent-status-bar {
            display: flex; gap: 32px;
        }
        .agent-metric {
            display: flex; flex-direction: column; gap: 4px;
        }
        .agent-metric.active { color: var(--slate); }
        .agent-metric.active .indicator { color: var(--accent); text-shadow: 0 0 8px var(--accent); }

        /* Chat Stream */
        .chat-container {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            width: 600px; max-height: 40vh;
            display: flex; flex-direction: column; justify-content: flex-end;
            mask-image: linear-gradient(to bottom, transparent 0%, black 20%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 20%);
            overflow: hidden; pointer-events: auto;
        }
        .messages {
            display: flex; flex-direction: column; gap: 12px;
            padding: 20px 0; overflow-y: auto;
            scrollbar-width: none;
        }
        .messages::-webkit-scrollbar { display: none; }
        
        .msg {
            display: flex; gap: 12px; font-size: 11px; line-height: 1.5;
            animation: fadein 0.3s ease-out;
        }
        @keyframes fadein { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
        
        .msg-sender {
            width: 60px; text-align: right; font-weight: 500; flex-shrink: 0;
        }
        .msg-content { color: #A1A3B0; }
        .msg.user .msg-sender { color: var(--steel); }
        .msg.agent .msg-sender { color: var(--accent); text-shadow: 0 0 6px rgba(0,229,255,0.4); }
        .msg.agent .msg-content { color: #D1D3E0; }

        /* Input Line - Single Borderless Line */
        .input-line {
            position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%);
            width: 600px; pointer-events: auto;
            display: flex; align-items: center;
        }
        .input-prompt {
            color: var(--accent); font-size: 11px; margin-right: 12px;
            text-shadow: 0 0 6px rgba(0,229,255,0.4);
        }
        .chat-input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #fff; font-family: var(--font-mono); font-size: 11px;
            padding: 8px 0; border-bottom: 1px solid var(--steel);
            transition: border-color 0.3s;
        }
        .chat-input:focus { border-bottom-color: var(--slate); }
        .chat-input::placeholder { color: var(--steel); }

        .thinking {
            position: absolute; bottom: 64px; left: 50%; transform: translateX(-50%);
            font-size: 10px; color: var(--steel); font-style: italic;
            opacity: 0; transition: opacity 0.3s;
        }
        .thinking.visible { opacity: 1; }
    </style>
</head>
<body>

<canvas id="glcanvas"></canvas>

<div class="overlay">
    <div class="hud-top">
        <div>XORAS // QUORUM <span id="hashDisplay">ROOT: —</span></div>
        <div class="agent-status-bar" id="statusBar"></div>
    </div>
    
    <div class="chat-container">
        <div class="messages" id="msgs"></div>
    </div>
    
    <div class="thinking" id="thinking">Agent processing...</div>
    
    <div class="input-line">
        <span class="input-prompt">❯</span>
        <input type="text" class="chat-input" id="inp" placeholder="Input sequence..." autocomplete="off">
    </div>
</div>

<script>
// =========================================================================
// WEBGL2 CONTROL ROOM PHYSICS — Instanced rendering (100k nodes)
// Palette: Slate, Steel, Cyan accent
// =========================================================================
const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
if (!gl) document.body.innerHTML = 'WebGL2 required';

let W, H;
function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * 2; canvas.height = H * 2;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    gl.viewport(0, 0, W*2, H*2);
}
window.addEventListener('resize', resize); resize();

function compile(src, type) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
}
function prog(vs, fs) {
    const p = gl.createProgram(); gl.attachShader(p, compile(vs, gl.VERTEX_SHADER)); gl.attachShader(p, compile(fs, gl.FRAGMENT_SHADER)); gl.linkProgram(p);
    return p;
}

// 1. Instanced Background Field Shader (100,000 tiny spheres)
const instVS = `#version 300 es
in vec2 aPos;
in vec4 aOffsetScale; // x, y, scale, phase
in vec3 aColor;       // r, g, b
uniform float uTime;
uniform float uAspect;
uniform float uPulse;
out vec2 vUV;
out float vBright;
out vec3 vColor;
void main() {
    vUV = aPos;
    float phase = aOffsetScale.w;
    float scale = aOffsetScale.z * 0.003;
    vColor = aColor;
    
    // Slow structural rotation
    float s = sin(uTime * 0.02);
    float c = cos(uTime * 0.02);
    vec2 pos = vec2(
        aOffsetScale.x * c - aOffsetScale.y * s,
        aOffsetScale.x * s + aOffsetScale.y * c
    );
    
    // Z-depth pulsing
    float wave = sin(length(pos)*2.0 - uTime);
    vBright = (0.3 + (sin(uTime + phase) * 0.5 + 0.5) * 0.4) * (1.0 + wave * uPulse * 2.0);
    
    gl_Position = vec4(pos + aPos * scale * vec2(1.0/uAspect, 1.0), 0.0, 1.0);
}`;
const instFS = `#version 300 es
precision highp float;
in vec2 vUV;
in float vBright;
in vec3 vColor;
out vec4 outColor;
void main() {
    float d = length(vUV);
    if (d > 1.0) discard;
    float core = smoothstep(1.0, 0.4, d);
    outColor = vec4(vColor * vBright * core, core * vBright);
}`;

// 2. Main Agent Orbs Shader
const orbVS = `#version 300 es
in vec2 aPos;
uniform vec2 uCenter;
uniform float uRadius;
uniform float uAspect;
out vec2 vUV;
void main() {
    vUV = aPos;
    gl_Position = vec4(uCenter + aPos * uRadius * vec2(1.0/uAspect, 1.0), 0.0, 1.0);
}`;
const orbFS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform vec3 uColor;
uniform float uGlow;
uniform float uTime;
out vec4 outColor;
void main() {
    float d = length(vUV);
    float core = smoothstep(0.2, 0.15, d);
    float halo = exp(-d * 4.0) * 0.5;
    
    // Minimalist clinical glow (less smoke, more precision)
    float pulse = 1.0 + sin(uTime * 3.0) * 0.1;
    float i = (core + halo) * uGlow * pulse;
    
    vec3 col = mix(vec3(0.9,0.9,1.0), uColor, 0.7) * i;
    col += vec3(1.0) * core * 0.5 * uGlow;
    
    outColor = vec4(col, i);
}`;

const pInst = prog(instVS, instFS);
const pOrb = prog(orbVS, orbFS);

// Geometry (Quad)
const quadData = new Float32Array([-1,-1, 1,-1, -1,1, 1,1]);
const quadBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
gl.bufferData(gl.ARRAY_BUFFER, quadData, gl.STATIC_DRAW);

// Load Real Codebase AST Nodes
const INST_COUNT = 1000000;
let instData = new Float32Array(INST_COUNT * 4); // x, y, scale, phase
let colorData = new Float32Array(INST_COUNT * 3); // r, g, b
const instBuf = gl.createBuffer();
const colorBuf = gl.createBuffer();

// Pre-allocate to prevent WebGL out of bounds error before fetch completes
gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
gl.bufferData(gl.ARRAY_BUFFER, INST_COUNT * 4 * 4, gl.DYNAMIC_DRAW);
gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
gl.bufferData(gl.ARRAY_BUFFER, INST_COUNT * 3 * 4, gl.DYNAMIC_DRAW);

let astLoaded = false;
fetch('ast_nodes.json').then(r => r.json()).then(data => {
    for(let i=0; i<data.nodes.length; i++) {
        let n = data.nodes[i];
        instData[i*4+0] = n.x;
        instData[i*4+1] = n.y;
        instData[i*4+2] = n.scale;
        instData[i*4+3] = Math.random() * Math.PI * 2;
        colorData[i*3+0] = n.r;
        colorData[i*3+1] = n.g;
        colorData[i*3+2] = n.b;
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, instData);
    gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, colorData);
    astLoaded = true;
});

// Agents Setup
const AGENTS = [
    { id:'maxx',  name:'MAXX',  col:[0.0, 0.9, 1.0], x:0, y:0, a:0, r:0.25, g:1, lb:Date.now() }, // Accent cyan
    { id:'vance', name:'VANCE', col:[0.5, 0.55, 0.6], x:0, y:0, a:2, r:0.25, g:1, lb:Date.now() }, // Steel
    { id:'eden',  name:'EDEN',  col:[0.6, 0.65, 0.7], x:0, y:0, a:4, r:0.25, g:1, lb:Date.now() }, // Slate
    { id:'daxx',  name:'DAXX',  col:[0.4, 0.45, 0.5], x:0, y:0, a:6, r:0.25, g:1, lb:Date.now() }  // Dark steel
];

const sb = document.getElementById('statusBar');
AGENTS.forEach(a => {
    const d = document.createElement('div'); d.className='agent-metric'; d.id='m-'+a.id;
    d.innerHTML = `<span class="indicator">●</span> ${a.name}`;
    sb.appendChild(d);
});

let t0 = performance.now()/1000, globalPulse = 0.0;
function draw() {
    requestAnimationFrame(draw);
    const t = performance.now()/1000 - t0;
    
    gl.clearColor(0.023, 0.023, 0.031, 1); // #060608 bg
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    
    // Calc aggregate activity for field pulse
    let activeAgents = 0;
    AGENTS.forEach((a, i) => {
        a.a += 0.005; // Slow deliberate orbit
        const act = Math.max(0.1, 1 - (Date.now()-a.lb)/60000);
        a.g = 0.2 + act * 0.8;
        if(act > 0.5) activeAgents++;
        
        a.x = Math.cos(a.a) * a.r;
        a.y = Math.sin(a.a) * a.r;
        
        const mel = document.getElementById('m-'+a.id);
        if(mel) mel.className = 'agent-metric ' + (act > 0.5 ? 'active' : '');
    });
    
    globalPulse += (activeAgents > 0 ? 1.0 : 0.0 - globalPulse) * 0.05;

    
    // Draw 100k Instanced Field
    gl.useProgram(pInst);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    const ip = gl.getAttribLocation(pInst, 'aPos');
    gl.enableVertexAttribArray(ip); gl.vertexAttribPointer(ip, 2, gl.FLOAT, false, 0, 0);
    
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    const io = gl.getAttribLocation(pInst, 'aOffsetScale');
    if (io >= 0) { gl.enableVertexAttribArray(io); gl.vertexAttribPointer(io, 4, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(io, 1); }
    
    gl.bindBuffer(gl.ARRAY_BUFFER, colorBuf);
    const ic = gl.getAttribLocation(pInst, 'aColor');
    if (ic >= 0) { gl.enableVertexAttribArray(ic); gl.vertexAttribPointer(ic, 3, gl.FLOAT, false, 0, 0); gl.vertexAttribDivisor(ic, 1); }
    
    gl.uniform1f(gl.getUniformLocation(pInst, 'uTime'), t);
    gl.uniform1f(gl.getUniformLocation(pInst, 'uAspect'), W/H);
    gl.uniform1f(gl.getUniformLocation(pInst, 'uPulse'), globalPulse);
    
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, INST_COUNT);
    if (io >= 0) gl.vertexAttribDivisor(io, 0);
    if (ic >= 0) gl.vertexAttribDivisor(ic, 0);

    
    // Draw Core Agent Orbs
    gl.useProgram(pOrb);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    const op = gl.getAttribLocation(pOrb, 'aPos');
    gl.enableVertexAttribArray(op); gl.vertexAttribPointer(op, 2, gl.FLOAT, false, 0, 0);
    
    AGENTS.forEach(a => {
        gl.uniform2f(gl.getUniformLocation(pOrb, 'uCenter'), a.x, a.y);
        gl.uniform1f(gl.getUniformLocation(pOrb, 'uRadius'), 0.25); // Smaller, precise
        gl.uniform1f(gl.getUniformLocation(pOrb, 'uAspect'), W/H);
        gl.uniform3fv(gl.getUniformLocation(pOrb, 'uColor'), a.col);
        gl.uniform1f(gl.getUniformLocation(pOrb, 'uGlow'), a.g);
        gl.uniform1f(gl.getUniformLocation(pOrb, 'uTime'), t);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    });
}
draw();

// =========================================================================
// CHAT & TELEMETRY LOGIC
// =========================================================================
const msgsEl = document.getElementById('msgs');
const inp = document.getElementById('inp');
let lastLen = 0;

function appendMsg(sender, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + (sender === 'user' ? 'user' : 'agent');
    
    let name = sender;
    if (sender === 'user') name = 'SYS';
    else {
        const ag = AGENTS.find(x => x.id === sender.toLowerCase());
        if (ag) { name = ag.name; ag.lb = Date.now(); }
        else name = sender.toUpperCase();
    }

    d.innerHTML = `
        <div class="msg-sender">${name}</div>
        <div class="msg-content">${text.replace(/</g,'&lt;')}</div>
    `;
    msgsEl.appendChild(d);
    msgsEl.parentElement.scrollTop = msgsEl.parentElement.scrollHeight;
}

inp.onkeydown = async (e) => {
    if(e.key === 'Enter' && inp.value.trim()) {
        const v = inp.value.trim();
        inp.value = '';
        try {
            await fetch('/api/chat', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({sender:'user', text:v})
            });
        } catch(err) {}
    }
};

setInterval(async () => {
    try {
        const r = await fetch('/api/chat_history');
        if(r.ok) {
            const arr = await r.json();
            if(arr.length > lastLen) {
                for(let i=lastLen; i<arr.length; i++) appendMsg(arr[i].sender, arr[i].text);
                lastLen = arr.length;
            }
        }
    } catch(e) {}
}, 1000);
</script>

</body>
</html>
